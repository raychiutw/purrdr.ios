name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# 群組名稱帶 workflow 名稱：被其他 workflow 呼叫時不會跟 PR 的 CI 搶同一個群組。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# package 與 app 兩個 job 跑在 xcode-27:GitHub 的 preview 映像(底層 macOS 27,預設 Xcode 27 / iOS 27 SDK)。
# preview 不穩(排隊超過 30 分鐘、映像壞掉)時，把 runs-on 暫時退回 macos-26,並在 PR 記錄證據。
jobs:
  package:
    name: Package 測試(swift test)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # SwiftUI 模組版本：同一版 Swift 編譯器分不出 SDK 27.0／27.1,`canImport(SwiftUI, _version:)` 以它判斷(PaneTerminalView)。
      - name: 工具鏈版本
        run: |
          xcodebuild -version
          swift --version
          for sdk in macosx iphonesimulator; do
            grep -ho 'user-module-version [0-9.]*' \
              "$(xcrun --sdk "$sdk" --show-sdk-path)"/System/Library/Frameworks/SwiftUI.framework/Modules/SwiftUI.swiftmodule/*.swiftinterface \
              | sort -u | sed "s/^/$sdk SwiftUI /"
          done

      # SwiftTerm(1.12 起)帶 Shaders.metal,編譯要 Metal Toolchain;Xcode 27 不內建，要另外下載(約 900 MB)。
      # 先用 -showComponent 檢查，已安裝就不下載。
      - name: 安裝 Metal Toolchain
        run: |
          if xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed'; then
            echo "Metal Toolchain 已安裝，略過下載"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain

      # warning 當 error 寫在 Package.swift(只對 macOS 套用)。
      - name: swift test
        run: swift test

  # 與 package job 平行(原本跟 swift test 串在同一個 job,是 CI 最慢的一段:4～5 分 + 5 分)。
  # import check 抓「沒宣告依賴卻 import」,例如 Features import Demo、上層功能 import PurrdrSSH(#89)。
  # 預設的 Swift Build 會忽略這個選項(實測照樣建置成功),只有 native build system 會擋，所以另外以 native 建置一次。
  import-check:
    name: 依賴方向(import check)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 工具鏈版本
        run: swift --version

      # SwiftTerm(1.12 起)帶 Shaders.metal,編譯要 Metal Toolchain;Xcode 27 不內建，要另外下載(約 900 MB)。
      - name: 安裝 Metal Toolchain
        run: |
          if xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed'; then
            echo "Metal Toolchain 已安裝，略過下載"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain

      - name: swift build(native,import check)
        run: swift build --build-system native --build-tests --explicit-target-dependency-import-check error

  # 與 package job 平行:package 以 iOS 編譯、數 warning、檢查 String Catalog(原本跟 swift test 串在同一個 job)。
  package-ios:
    name: Package iOS 編譯與字串表
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 工具鏈版本
        run: xcodebuild -version

      # SwiftTerm(1.12 起)帶 Shaders.metal,編譯要 Metal Toolchain;Xcode 27 不內建，要另外下載(約 900 MB)。
      - name: 安裝 Metal Toolchain
        run: |
          if xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed'; then
            echo "Metal Toolchain 已安裝，略過下載"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain

      # Xcode 建置 app 時會把 package 的 warning 壓掉，所以另外在 package 根目錄以 iOS 編譯一次。
      # 不能用 SWIFT_TREAT_WARNINGS_AS_ERRORS=YES:它也會套到 SwiftTerm、swift-nio 這類遠端 package,
      # 跟 Xcode 給遠端 package 的 -suppress-warnings 衝突。改用 result bundle 數 warning
      # (遠端 package 的 warning 已被壓掉，數到的都是我們自己的)。
      # -skipPackagePluginValidation:SwiftTerm(1.19 起)帶 build-tool plugin(SwiftTermBuildInfoPlugin),
      # 命令列建置沒辦法像 Xcode 介面那樣按「信任」,不跳過驗證會直接失敗。
      - name: 以 iOS 編譯 package
        run: >
          xcodebuild build
          -scheme Purrdr-Package
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .derivedData/package
          -resultBundlePath .derivedData/package/Package.xcresult
          -skipPackagePluginValidation
          SWIFT_EMIT_LOC_STRINGS=YES

      - name: 檢查 package 零 warning
        run: |
          xcrun xcresulttool get build-results --path .derivedData/package/Package.xcresult > package-results.json
          warnings="$(jq '.warningCount' package-results.json)"
          echo "warningCount=$warnings"
          jq -r '.warnings[]? | "::warning::\(.message)"' package-results.json
          test "$warnings" -eq 0

      # 畫面字串(編譯器抽出)都在 String Catalog 且有繁體中文(#32)。用上一步的 derivedData,不另外建置。
      - name: 檢查 String Catalog
        run: scripts/strings.sh check .derivedData/package

  # Purrdr 後台(backend/):Workers 本機測試環境(@cloudflare/vitest-plugin + 本機 D1),不連 Cloudflare、不部署。
  backend:
    name: 後台測試(vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安裝依賴
        run: npm ci

      - name: 型別檢查(含 wrangler types 是否最新)
        run: npm run typecheck

      - name: 測試
        run: npm test

  # 主機服務(host-service/,ADR-0010):三平台各跑一次，herdr socket 路徑解析與假 herdr socket
  # (macOS／Linux 是 Unix socket,Windows 是 named pipe)都要在該平台實跑。
  # 協定型別是否與 protocol/host-service.schema.json 同步，由 codegen 的測試把關。
  host-service:
    name: 主機服務測試(cargo test,${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: host-service
        shell: bash
    env:
      RUSTFLAGS: -D warnings
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 安裝 Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cargo --version

      - name: 格式與 clippy
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  # CI 不做 UI 測試(太久);UI 測試在本機跑，只跑有修改到的類別(見 AGENTS.md「常用指令」)。
  app:
    name: App 編譯(xcodebuild build)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 工具鏈版本
        run: xcodebuild -version

      # SwiftTerm(1.12 起)帶 Shaders.metal,編譯要 Metal Toolchain;Xcode 27 不內建，要另外下載(約 900 MB)。
      # 先用 -showComponent 檢查，已安裝就不下載。
      - name: 安裝 Metal Toolchain
        run: |
          if xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed'; then
            echo "Metal Toolchain 已安裝，略過下載"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain

      # -skipPackagePluginValidation:同 package job,SwiftTerm 的 build-tool plugin 在命令列無法手動信任。
      - name: xcodebuild build
        run: >
          xcodebuild build
          -project src/App/Purrdr.xcodeproj
          -scheme Purrdr
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .derivedData
          -resultBundlePath .derivedData/Purrdr.xcresult
          -skipPackagePluginValidation

      - name: 檢查零 warning
        run: |
          xcrun xcresulttool get build-results --path .derivedData/Purrdr.xcresult > build-results.json
          warnings="$(jq '.warningCount' build-results.json)"
          echo "warningCount=$warnings"
          jq -r '.warnings[]? | "::warning::\(.message)"' build-results.json
          test "$warnings" -eq 0

      - name: 上傳建置結果
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Purrdr.xcresult
          path: .derivedData/Purrdr*.xcresult
          retention-days: 7

  # 可攜核心(ADR-0006)用 Swift SDK for Android 交叉編譯，守住「不依賴 Apple 專屬 framework」。
  # 版本與做法見 docs/research/swift-sdk-for-android.md:開源 toolchain 與 SDK 版本必須完全一致、NDK 用 r30。
  # 只編譯可攜的 target(PurrdrDemo,連帶編譯它依賴的 PurrdrSSH、PurrdrCore),SwiftUI 的 Features 不在 Android 編譯範圍。
  android:
    name: 可攜核心 Android 編譯(Swift SDK for Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4.2-noble
    env:
      SWIFT_SDK: swift-6.4.2-RELEASE_android
      SDK_URL: https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz
      SDK_CHECKSUM: 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
      NDK_VERSION: r30
    strategy:
      fail-fast: false
      matrix:
        triple: [aarch64-unknown-linux-android28, x86_64-unknown-linux-android28]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 安裝工具
        run: apt-get update && apt-get install -y --no-install-recommends curl unzip

      # SDK 裝到固定位置(--swift-sdks-path),後面找 bundle 與 swift build 都用它。
      # 不能靠 $HOME:容器裡 HOME=/github/home,SwiftPM 卻依 passwd 裝到 /root/.swiftpm,
      # 之前 `find "$HOME"` 找不到 bundle,`test -n` 在 sh -e 下無聲地讓「安裝 Android NDK」失敗。
      - name: 安裝 Swift SDK for Android
        run: |
          swift --version
          swift sdk install "$SDK_URL" --checksum "$SDK_CHECKSUM" --swift-sdks-path "$RUNNER_TEMP/swift-sdks"
          swift sdk list --swift-sdks-path "$RUNNER_TEMP/swift-sdks"

      - name: 安裝 Android NDK 並連結到 SDK
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip -d "$RUNNER_TEMP"
          export ANDROID_NDK_HOME="$RUNNER_TEMP/android-ndk-${NDK_VERSION}"
          bundle="$(find "$RUNNER_TEMP/swift-sdks" -maxdepth 2 -type d -name "${SWIFT_SDK}.artifactbundle" | head -n 1)"
          if [ -z "$bundle" ]; then
            echo "::error::找不到 ${SWIFT_SDK}.artifactbundle(在 $RUNNER_TEMP/swift-sdks)"
            ls -la "$RUNNER_TEMP/swift-sdks" || true
            exit 1
          fi
          "$bundle/swift-android/scripts/setup-android-sdk.sh"

      # SwiftPM 新預設 build system 的 Android 支援與 SDK 的 NDK 連結方式不同，跟 swift-nio 的 CI 一樣用 native。
      - name: swift build(${{ matrix.triple }})
        run: >
          swift build
          --build-system native
          --swift-sdk "$SWIFT_SDK"
          --swift-sdks-path "$RUNNER_TEMP/swift-sdks"
          --triple "${{ matrix.triple }}"
          --static-swift-stdlib
          --target PurrdrDemo
          -Xswiftc -warnings-as-errors
