name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# 群組名稱帶 workflow 名稱：被其他 workflow 呼叫時不會跟 PR 的 CI 搶同一個群組。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# package 與 app 兩個 job 跑在 xcode-27:GitHub 的 preview 映像(底層 macOS 27,預設 Xcode 27 / iOS 27 SDK)。
# preview 不穩(排隊超過 30 分鐘、映像壞掉)時，把 runs-on 暫時退回 macos-26,並在 PR 記錄證據。
jobs:
  package:
    name: Package 測試(swift test)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # SwiftUI 模組版本：同一版 Swift 編譯器分不出 SDK 27.0／27.1,`canImport(SwiftUI, _version:)` 以它判斷(PaneTerminalView)。
      - name: 工具鏈版本
        run: |
          xcodebuild -version
          swift --version
          for sdk in macosx iphonesimulator; do
            grep -ho 'user-module-version [0-9.]*' \
              "$(xcrun --sdk "$sdk" --show-sdk-path)"/System/Library/Frameworks/SwiftUI.framework/Modules/SwiftUI.swiftmodule/*.swiftinterface \
              | sort -u | sed "s/^/$sdk SwiftUI /"
          done

      # SwiftTerm(1.12 起)帶 Shaders.metal,編譯要 Metal Toolchain;Xcode 27 不內建，要另外下載(約 900 MB)。
      # 先用 -showComponent 檢查，已安裝就不下載。
      - name: 安裝 Metal Toolchain
        run: |
          if xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed'; then
            echo "Metal Toolchain 已安裝，略過下載"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain

      # warning 當 error 寫在 Package.swift(只對 macOS 套用)。
      - name: swift test
        run: swift test

  # 與 package job 平行(原本跟 swift test 串在同一個 job,是 CI 最慢的一段:4～5 分 + 5 分)。
  # import check 抓「沒宣告依賴卻 import」,例如 Features import Demo、上層功能 import PurrdrSSH(#89)。
  # 預設的 Swift Build 會忽略這個選項(實測照樣建置成功),只有 native build system 會擋，所以另外以 native 建置一次。
  import-check:
    name: 依賴方向(import check)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 工具鏈版本
        run: swift --version

      # SwiftTerm(1.12 起)帶 Shaders.metal,編譯要 Metal Toolchain;Xcode 27 不內建，要另外下載(約 900 MB)。
      - name: 安裝 Metal Toolchain
        run: |
          if xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed'; then
            echo "Metal Toolchain 已安裝，略過下載"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain

      - name: swift build(native,import check)
        run: swift build --build-system native --build-tests --explicit-target-dependency-import-check error

  # 與 package job 平行:package 以 iOS 編譯、數 warning、檢查 String Catalog(原本跟 swift test 串在同一個 job)。
  package-ios:
    name: Package iOS 編譯與字串表
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 工具鏈版本
        run: xcodebuild -version

      # SwiftTerm(1.12 起)帶 Shaders.metal,編譯要 Metal Toolchain;Xcode 27 不內建，要另外下載(約 900 MB)。
      - name: 安裝 Metal Toolchain
        run: |
          if xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed'; then
            echo "Metal Toolchain 已安裝，略過下載"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain

      # Xcode 建置 app 時會把 package 的 warning 壓掉，所以另外在 package 根目錄以 iOS 編譯一次。
      # 不能用 SWIFT_TREAT_WARNINGS_AS_ERRORS=YES:它也會套到 SwiftTerm、swift-nio 這類遠端 package,
      # 跟 Xcode 給遠端 package 的 -suppress-warnings 衝突。改用 result bundle 數 warning
      # (遠端 package 的 warning 已被壓掉，數到的都是我們自己的)。
      # -skipPackagePluginValidation:SwiftTerm(1.19 起)帶 build-tool plugin(SwiftTermBuildInfoPlugin),
      # 命令列建置沒辦法像 Xcode 介面那樣按「信任」,不跳過驗證會直接失敗。
      - name: 以 iOS 編譯 package
        run: >
          xcodebuild build
          -scheme Purrdr-Package
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .derivedData/package
          -resultBundlePath .derivedData/package/Package.xcresult
          -skipPackagePluginValidation
          SWIFT_EMIT_LOC_STRINGS=YES

      - name: 檢查 package 零 warning
        run: |
          xcrun xcresulttool get build-results --path .derivedData/package/Package.xcresult > package-results.json
          warnings="$(jq '.warningCount' package-results.json)"
          echo "warningCount=$warnings"
          jq -r '.warnings[]? | "::warning::\(.message)"' package-results.json
          test "$warnings" -eq 0

      # 畫面字串(編譯器抽出)都在 String Catalog 且有繁體中文(#32)。用上一步的 derivedData,不另外建置。
      - name: 檢查 String Catalog
        run: scripts/strings.sh check .derivedData/package

  # 主機端在 raychiutw/purrdr.host:協定型別、schema 與 examples、主機服務版本是同步來的副本(scripts/sync-purrdr-host.sh)。
  # 依 vendor/purrdr-host/VERSION 記的 commit 重新取回比對，確認沒被手改、也沒漏同步。
  purrdr-host-sync:
    name: 主機端同步檢查(sync-purrdr-host --check)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 比對 purrdr.host 的同步副本
        run: scripts/sync-purrdr-host.sh --check

  # Purrdr Plus 編譯開關(#676):上架版(Release)不提供訂閱與主機同步。要開放 Plus 時同步改這裡的預期值與 docs/launch/checklist.md 5.5。
  plus-flag:
    name: Purrdr Plus 編譯開關(Release 要關閉)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Release 的 PURRDR_PLUS_ENABLED 是 NO
        run: |
          set -euo pipefail
          value="$(scripts/plus-enabled.sh Release)"
          if [ "$value" != "NO" ]; then
            echo "Release 的 PURRDR_PLUS_ENABLED 是 $value,上架版必須是 NO(見 docs/launch/checklist.md 5.5)" >&2
            exit 1
          fi

  # Windows 取檔腳本(PowerShell)的契約測試:與 POSIX 版(HostFileFetchScriptRulesTests)、app、主機服務共用同一份案例
  # (vendor/purrdr-host/protocol/host-file-access.json),另以真的 junction／symlink／8.3 短檔名／ADS／UNC 檢查。
  # 腳本直接從 Swift 原始碼抽出(不需要 Swift 工具鏈,跟 app 送出的是同一份字串),以 stdin stub 在本機啟動 powershell.exe,不需要 sshd。
  # job 一律啟動、沒有相關改動時只跑偵測步驟就成功:這樣可以列為 required check,又不會卡住沒動到相關檔案的 PR。
  windows-fetch-contract:
    name: Windows 取檔腳本契約(共用存取案例)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: 偵測相關改動
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # 非 PR 事件(workflow_call)或 workflow 檔本身有改:一律執行。
          if [ -z "${BASE_SHA:-}" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "非 PR 事件,執行"; exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(src/[^/]+/(WindowsScripts|WindowsHostChannel|HostScriptTimeLimit|HostServiceProtocol)\.swift|vendor/purrdr-host/protocol/|scripts/windows-(file-fetch|upload)-repro\.py|\.github/workflows/ci\.yml)$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"; echo "沒有相關改動,略過契約測試"
          fi

      - name: 工具版本
        if: steps.changes.outputs.relevant == 'true'
        shell: pwsh
        run: |
          python --version
          powershell.exe -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          fsutil 8dot3name query C:

      # PURRDR_WINDOWS_LOCAL=1:不經 sshd,直接啟動 powershell.exe(參數與 app 相同)。contract = shared + access。
      - name: 執行共用存取案例
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        env:
          PURRDR_WINDOWS_LOCAL: "1"
        run: python -I scripts/windows-file-fetch-repro.py --kind contract

  # 升版本號(MARKETING_VERSION)時要同時寫版本說明:目前版本號在 CHANGELOG.md 要有對應的 "## <版本號>" 段落。
  # 發版時 GitHub Release 的「本版更新」就是取這一段(見 testflight.yml)。
  changelog:
    name: 版本說明(CHANGELOG.md)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 目前版本號有版本說明
        run: |
          set -euo pipefail
          version="$(scripts/marketing-version.sh HEAD)"
          scripts/changelog-section.sh "$version" > /dev/null

  # CI 不做 UI 測試(太久);UI 測試在本機跑，只跑有修改到的類別(見 AGENTS.md「常用指令」)。
  app:
    name: App 編譯(xcodebuild build)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 工具鏈版本
        run: xcodebuild -version

      # SwiftTerm(1.12 起)帶 Shaders.metal,編譯要 Metal Toolchain;Xcode 27 不內建，要另外下載(約 900 MB)。
      # 先用 -showComponent 檢查，已安裝就不下載。
      - name: 安裝 Metal Toolchain
        run: |
          if xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed'; then
            echo "Metal Toolchain 已安裝，略過下載"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain

      # -skipPackagePluginValidation:同 package job,SwiftTerm 的 build-tool plugin 在命令列無法手動信任。
      - name: xcodebuild build
        run: >
          xcodebuild build
          -project src/App/Purrdr.xcodeproj
          -scheme Purrdr
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .derivedData
          -resultBundlePath .derivedData/Purrdr.xcresult
          -skipPackagePluginValidation

      - name: 檢查零 warning
        run: |
          xcrun xcresulttool get build-results --path .derivedData/Purrdr.xcresult > build-results.json
          warnings="$(jq '.warningCount' build-results.json)"
          echo "warningCount=$warnings"
          jq -r '.warnings[]? | "::warning::\(.message)"' build-results.json
          test "$warnings" -eq 0

      - name: 上傳建置結果
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Purrdr.xcresult
          path: .derivedData/Purrdr*.xcresult
          retention-days: 7
