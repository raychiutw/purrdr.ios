# Purrdr 主機外掛(ADR-0004):Agent 進入「需要你」時，通知 Purrdr 後台推播到配對的 iPhone／iPad。
#
# 由 Purrdr app 經 SSH 以 `herdr plugin install raychiutw/purrdr-host-plugin --yes` 安裝，
# 配對資料在 ~/.purrdr/push-<裝置>/pairing(由 app 寫入、關閉推播時移除)。
# 推播只帶 workspace 名稱、狀態與 pane id,不帶任何對話內容。
id = "purrdr.push"
name = "Purrdr Push"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Notify Purrdr on your iPhone or iPad when an agent needs you"
platforms = ["linux", "macos", "windows"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "notify.sh"]
platforms = ["linux", "macos"]

# Windows 的 herdr plugin 仍是 preview,推播是 best-effort。
[[events]]
on = "pane.agent_status_changed"
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "notify.ps1"]
platforms = ["windows"]
