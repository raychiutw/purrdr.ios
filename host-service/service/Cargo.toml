[package]
name = "purrdr-host-service"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
futures-util.workspace = true
getrandom = "0.4.3"
humantime = "2.4.0"
qrcode = { version = "0.14.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
base64 = "0.22.1"
futures-util.workspace = true
tempfile = "3.27.0"
tokio-tungstenite.workspace = true

[lints]
workspace = true

# 假的 herdr CLI 是這支測試執行檔本身(帶 fake-herdr 參數),所以不用 libtest。
[[test]]
name = "pane_terminal"
harness = false

# 壓縮檔裡假的主機服務是這支測試執行檔本身，所以不用 libtest。
[[test]]
name = "install_script"
harness = false
