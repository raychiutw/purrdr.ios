# 主機服務(ADR-0010):HTTPS 連線方式在主機上執行的常駐程式。
# - service:主機服務本體(只聽 127.0.0.1,直接連 herdr 本機 socket)
# - codegen:由 protocol/host-service.schema.json 產生 Rust 與 Swift 協定型別
[workspace]
members = ["service", "codegen"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"

[workspace.lints.rust]
unsafe_code = "forbid"
