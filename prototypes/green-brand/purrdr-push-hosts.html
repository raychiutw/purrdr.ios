<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>通知按主機</title>
<style>
/* PROTOTYPE（拋棄式）：推播按主機管理（#261）。#variant=A|B|C；點開關可操作，右側顯示狀態。 */
:root{--page:#f2f2f7;--surface:#fff;--fg:#000;--secondary:#3c3c4399;--tertiary:#3c3c434d;--separator:#3c3c4329;--fill:#7878801f;--press:#e5e5ea;
  --accent:#0b7a5c;--on-accent:#fff;--accent-soft:#0b7a5c1f;--orange:#ff9500;--red:#ff3b30;--bar-bg:#111;--bar-fg:#fff;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#000;--surface:#1c1c1e;--fg:#fff;--secondary:#ebebf599;--tertiary:#ebebf54d;--separator:#54545899;--fill:#7878805c;--press:#2c2c2e;
  --accent:#3ccf9e;--on-accent:#000;--accent-soft:#3ccf9e29;--orange:#ff9f0a;--red:#ff453a;--bar-bg:#f2f2f7;--bar-fg:#000;color-scheme:dark}}
:root[data-theme="dark"]{--page:#000;--surface:#1c1c1e;--fg:#fff;--secondary:#ebebf599;--tertiary:#ebebf54d;--separator:#54545899;--fill:#7878805c;--press:#2c2c2e;
  --accent:#3ccf9e;--on-accent:#000;--accent-soft:#3ccf9e29;--orange:#ff9f0a;--red:#ff453a;--bar-bg:#f2f2f7;--bar-fg:#000;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;padding:16px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto}h1{font-size:20px;margin:0 0 4px}.lede{color:var(--secondary);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:20px;align-items:start}@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.phone{border:1px solid var(--separator);border-radius:32px;overflow:hidden;background:var(--page);min-height:740px;position:relative;display:flex;flex-direction:column}
.screen{flex:1;overflow:auto;padding-bottom:20px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;min-height:46px}.nav .t{font-weight:600;font-size:17px;flex:1;text-align:center}
.btn{color:var(--accent);background:none;border:0;font:inherit;padding:6px;cursor:pointer;min-width:60px;text-align:left}.btn.r{text-align:right;font-weight:600}
.sect{font-size:13px;color:var(--secondary);padding:14px 30px 6px}.foot{font-size:13px;color:var(--secondary);padding:6px 30px 2px}
.group{background:var(--surface);border-radius:12px;margin:0 14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;min-height:48px;position:relative;border:0;background:none;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row:active{background:var(--press)}.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:.5px solid var(--separator)}
.main{flex:1;min-width:0}.sub{font-size:13px;color:var(--secondary)}.sub.warn{color:var(--fg)}
.hi{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
svg.g{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;flex:none}.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:left .15s}
.toggle.on{background:#34c759}.toggle.on::after{left:22px}.toggle.dis{opacity:.4}
.spin{width:18px;height:18px;border:2px solid var(--fill);border-top-color:var(--secondary);border-radius:50%;animation:s 1s linear infinite;flex:none}@keyframes s{to{transform:rotate(360deg)}}
.ic{color:var(--orange);font-weight:700;margin-right:4px}.icr{color:var(--red);font-weight:700;margin-right:4px}
.steps{background:var(--surface);border-radius:14px;margin:0 14px;padding:14px}.steps h3{margin:0 0 2px;font-size:17px}
.prog{display:flex;gap:6px;margin:10px 0 8px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--fill)}.prog i.done{background:var(--accent)}
.step{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:.5px solid var(--separator)}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--fill);color:var(--secondary);flex:none}
.step.done .num{background:var(--accent);color:var(--on-accent)}.step.now .num{border:2px solid var(--accent);color:var(--accent);background:none}
.pill{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:inherit;font-size:14px;font-weight:600;padding:6px 14px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--fill);display:inline-flex;align-items:center;gap:4px}
.ov{position:absolute;inset:0;background:#0006;z-index:4;display:flex;flex-direction:column;justify-content:flex-end}
.ovs{background:var(--page);border-radius:14px 14px 0 0;min-height:70%;display:flex;flex-direction:column}
.alert{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:280px;background:var(--surface);border-radius:14px;z-index:6;text-align:center;overflow:hidden;box-shadow:0 10px 40px #0005}
.alert .b{padding:18px 16px 14px}.alert h4{margin:0 0 4px;font-size:17px}.alert p{margin:0;font-size:13px}
.alert .acts{display:flex;border-top:.5px solid var(--separator)}.alert .acts button{flex:1;border:0;background:none;color:var(--accent);font:inherit;font-size:17px;padding:11px;cursor:pointer}
.alert .acts button+button{border-left:.5px solid var(--separator);font-weight:600}
.notes{background:var(--surface);border-radius:14px;padding:16px 18px}.notes h2{font-size:16px;margin:0 0 8px}.notes ul{margin:0 0 12px;padding-left:20px}.notes li{margin:3px 0}
.state{font:13px/1.55 ui-monospace,Menlo,monospace;background:var(--fill);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bar-bg);color:var(--bar-fg);border-radius:999px;padding:6px;display:flex;gap:4px;box-shadow:0 6px 24px #0005;max-width:calc(100% - 32px);overflow-x:auto;z-index:9}
.switcher button{border:0;background:none;color:inherit;font:inherit;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}.switcher button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<h1>通知按主機管理（#261）</h1>
<p class="lede">拋棄式原型。底部切 A／B／C；點開關會跳確認、模擬安裝。主機：Mac mini（SSH）、Ray PC（HTTPS 主機服務 0.5.0）、Studio（HTTPS 主機服務 0.4.0，太舊）、Demo。</p>
<div class="grid">
  <div class="phone"><div class="screen" id="screen"></div><div id="ov"></div></div>
  <div class="notes"><h2 id="t"></h2><ul id="n"></ul>
    <h2>三版共同</h2><ul>
      <li>每台主機一個開關；SSH 與 HTTPS 都能開（HTTPS 由主機服務代裝外掛）。</li>
      <li>開之前確認對話框寫主機名稱；關閉會移除那台的外掛與配對。</li>
      <li>不能開的寫原因：Demo、主機服務太舊（附「更新主機服務」）、離線。</li>
      <li>步驟卡在至少一台開啟後算完成。</li></ul>
    <h2>目前狀態</h2><div class="state" id="state"></div></div>
</div>
</div>
<div class="switcher"><button data-v="A">A 帳號頁直接列主機</button><button data-v="B">B 步驟卡開主機清單</button><button data-v="C">C 一列摘要＋推入清單</button><button id="th">深淺色</button></div>
<script>
const P={macMini:'<rect x="3" y="9" width="18" height="6" rx="2.5"/><path d="M7 15.5v1M17 15.5v1M15 12h2"/>',pc:'<rect x="7" y="2.5" width="10" height="19" rx="1.8"/><circle cx="12" cy="17" r="1.4"/><path d="M10 6h4M10 9h4"/>',cloud:'<path d="M7 18h10.5a3.5 3.5 0 0 0 .4-7A5.5 5.5 0 0 0 7.3 9.6 4.2 4.2 0 0 0 7 18Z"/>',desktop:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/>'};
const hi=k=>`<span class="hi"><svg class="g" viewBox="0 0 24 24">${P[k]}</svg></span>`;
const H=[{id:"mini",n:"Mac mini",i:"macMini",via:"SSH",st:"on"},{id:"pc",n:"Ray PC",i:"pc",via:"HTTPS",st:"off"},{id:"studio",n:"Studio",i:"cloud",via:"HTTPS",st:"old"},{id:"demo",n:"Demo",i:"desktop",via:"Demo",st:"demo"}];
const V={A:["A：帳號頁直接列出每台主機（使用者選定）","四步都完成、步驟卡收成「Purrdr Plus・已開通」後，「通知」區塊（每台主機開關）與「主機同步」開關仍留在帳號頁，隨時可開關。","「通知」區塊直接在帳號頁列所有主機與開關，一眼看完。","步驟卡第 ③ 步的按鈕捲到這個區塊。","主機多時帳號頁變長。"],
B:["B：步驟卡按「開啟」開主機清單（推薦）","步驟卡第 ③ 步「選擇主機」打開 sheet，列主機與開關；至少一台開啟就完成。","開通後頁面的「通知」列也推入同一份清單。","第一次設定最清楚，平常不佔帳號頁空間。"],
C:["C：一列摘要，點了推入清單","帳號頁只有一列「通知：Mac mini、Ray PC」，點進去才是清單。","最精簡；看不到哪台失敗，要點進去。",""]};
let v=(location.hash.match(/variant=([ABC])/)||[])[1]||"A",sheet=false,alert=null,complete=false;
const onCount=()=>H.filter(h=>h.st==="on").length;
function status(h){return{on:["通知已開啟",""],off:[`未開啟 · ${h.via==="HTTPS"?"由主機服務安裝":"透過 SSH 安裝"}`,""],busy:["安裝中…",""],old:['<span class="ic">!</span>主機服務 0.4.0 太舊，請更新到 0.5.1 以上',"warn"],demo:["Demo 主機無法通知",""],fail:['<span class="icr">!</span>安裝失敗：herdr 沒回應。點開關重試',"warn"]}[h.st]}
function row(h){const [s,c]=status(h);const dis=h.st==="old"||h.st==="demo";const right=h.st==="busy"?'<span class="spin"></span>':`<span class="toggle${h.st==="on"?" on":""}${dis?" dis":""}"></span>`;
 return `<button class="row" data-h="${h.id}" ${dis?'data-dis="1"':""} aria-label="${h.n}，${h.st==="on"?"通知已開啟":"通知未開啟"}">${hi(h.i)}<span class="main">${h.n}<div class="sub ${c}">${s}</div></span>${right}</button>`}
function list(){return `<div class="group">${H.map(row).join("")}</div><div class="foot">Agent 需要你時通知這支 iPhone。關閉會移除那台主機上的 Purrdr 外掛與配對。只顯示 workspace 名稱，不含對話內容。</div>`}
function steps(){const done=onCount()>0;const s=[["加入會員",1],["開通 Purrdr Plus",1],["開啟通知",done],["同步主機名單",0]];const now=s.findIndex(x=>!x[1]);
 return `<div class="steps"><h3>設定 Purrdr Plus</h3><div class="sub">完成 ${s.filter(x=>x[1]).length}／4</div><div class="prog">${s.map(x=>`<i class="${x[1]?"done":""}"></i>`).join("")}</div>${s.map((x,i)=>`<div class="step ${x[1]?"done":i===now?"now":""}"><span class="num">${x[1]?"✓":i+1}</span><span class="main"><b style="font-weight:${i===now?600:400}">${x[0]}</b>${i===2?`<div class="sub">${done?H.filter(h=>h.st==="on").map(h=>h.n).join("、"):"選擇要通知的主機"}</div>`:""}</span>${i===now?`<button class="pill" data-act="${i===2?"sheet":"noop"}">${i===2?"選擇主機":"開啟"}</button>`:""}${i===2&&x[1]&&v!=="A"?`<button class="btn r" data-act="sheet" style="min-width:auto">管理</button>`:""}</div>`).join("")}</div>`}
function render(){
 document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 let h=`<div class="nav"><span class="btn"></span><span class="t">帳號</span><button class="btn r">完成</button></div>`+(complete?`<div class="group"><div class="row" style="cursor:default"><span class="main"><b>Purrdr Plus・已開通</b><div class="sub">年訂閱・下次扣款 2027/11/20</div></span></div></div>`:steps());
 if(v==="A")h+=`<div class="sect">通知</div>`+list()+(complete?`<div class="sect">主機同步</div><div class="group"><div class="row" style="cursor:default"><span class="main">同步主機名單<div class="sub">上次同步：剛剛</div></span><span class="toggle on"></span></div></div>`:"");
 h+=`<div style="padding:14px 30px 0"><button class="btn" data-act="complete" style="min-width:auto">（原型）${complete?"回到設定中":"切到四步都完成後"}</button></div>`;
 if(v==="C")h+=`<div class="sect">Purrdr Plus</div><div class="group"><button class="row" data-act="sheet" style="--x:0"><span class="main">通知<div class="sub">${onCount()?H.filter(x=>x.st==="on").map(x=>x.n).join("、"):"未開啟"}</div></span><span style="color:var(--tertiary)">›</span></button></div>`;
 h+=`<div class="sect">登入方式</div><div class="group"><div class="row" style="cursor:default"><span class="main">Google</span></div></div>`;
 document.getElementById("screen").innerHTML=h;
 let o="";if(sheet)o+=`<div class="ov"><div class="ovs"><div class="nav"><span class="btn"></span><span class="t">通知</span><button class="btn r" data-act="close">完成</button></div>${list()}</div></div>`;
 if(alert){const x=H.find(y=>y.id===alert);o+=`<div class="alert"><div class="b"><h4>在「${x.n}」開啟通知？</h4><p>${x.via==="HTTPS"?"Purrdr 會請這台的主機服務安裝 herdr 外掛":"Purrdr 會以 ray 身分執行「herdr plugin install」"}，並在 ~/.purrdr 存一組配對金鑰。關閉通知會移除兩者。</p></div><div class="acts"><button data-act="no">取消</button><button data-act="yes">安裝</button></div></div>`}
 document.getElementById("ov").innerHTML=o;
 document.getElementById("t").textContent=V[v][0];document.getElementById("n").innerHTML=V[v].slice(1).filter(Boolean).map(x=>`<li>${x}</li>`).join("");
 document.getElementById("state").textContent=JSON.stringify(Object.fromEntries(H.map(x=>[x.n,x.st])),null,2);
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-v],[data-act],[data-h]");if(!t)return;const d=t.dataset;
 if(d.v){v=d.v;sheet=false;location.hash="variant="+v}
 else if(d.h){if(d.dis)return;const x=H.find(y=>y.id===d.h);if(x.st==="on"){x.st="off"}else if(x.st==="off"||x.st==="fail"){alert=x.id}}
 else switch(d.act){case"sheet":sheet=true;break;case"close":sheet=false;break;case"complete":complete=!complete;break;case"no":alert=null;break;
  case"yes":{const x=H.find(y=>y.id===alert);alert=null;x.st="busy";render();setTimeout(()=>{x.st=x.id==="pc"&&!x.tried?(x.tried=1,"fail"):"on";render()},1200);return}}
 render()});
document.getElementById("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark"};
render();
</script>
</body>
</html>
