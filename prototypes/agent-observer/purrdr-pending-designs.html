<title>Purrdr 待定畫面</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* PROTOTYPE(拋棄式，第 2 版 2026-11-20:已決定的標 ✓;#306、#307 加定案版;#309、#313 重畫，第 1 版內容在 old 欄位與 purrdr-pending-designs-v1.html):#298 系列與 #295、#313 的畫面選項。#t300-a 之類的 hash 切換票與版本;底部列 ← → 換版本、「選這個」記下選擇;#picks 彙整。
   沿用 prototypes/green-brand/purrdr-screens.html 的色票：B 翡翠綠、需要你＝系統橙、按壓灰、頁面只放標題。 */
:root{--page:#f2f2f7;--surface:#fff;--fg:#000;--secondary:#3c3c4399;--tertiary:#3c3c434d;--separator:#3c3c4329;--press:#e5e5ea;--fill:#7878801f;
  --accent:#0b7a5c;--on-accent:#fff;--accent-soft:#0b7a5c1f;--orange:#ff9500;--orange-soft:#ff95001f;--red:#ff3b30;--red-soft:#ff3b301a;--gray:#8e8e93;
  --add:#0b7a5c1a;--del:#ff3b301a;--bar-bg:#111;--bar-fg:#fff;--claude:#a8674a;--codex:#4b6683;--shade:#0006;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#000;--surface:#1c1c1e;--fg:#fff;--secondary:#ebebf599;--tertiary:#ebebf54d;--separator:#54545899;--press:#2c2c2e;--fill:#7878805c;
  --accent:#3ccf9e;--on-accent:#000;--accent-soft:#3ccf9e29;--orange:#ff9f0a;--orange-soft:#ff9f0a29;--red:#ff453a;--red-soft:#ff453a29;--add:#3ccf9e24;--del:#ff453a29;--bar-bg:#f2f2f7;--bar-fg:#000;--claude:#b87658;--codex:#5a7898;--shade:#000a;color-scheme:dark}}
:root[data-theme="dark"]{--page:#000;--surface:#1c1c1e;--fg:#fff;--secondary:#ebebf599;--tertiary:#ebebf54d;--separator:#54545899;--press:#2c2c2e;--fill:#7878805c;
  --accent:#3ccf9e;--on-accent:#000;--accent-soft:#3ccf9e29;--orange:#ff9f0a;--orange-soft:#ff9f0a29;--red:#ff453a;--red-soft:#ff453a29;--add:#3ccf9e24;--del:#ff453a29;--bar-bg:#f2f2f7;--bar-fg:#000;--claude:#b87658;--codex:#5a7898;--shade:#000a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
.wrap{max-width:1280px;margin:0 auto}
header.top{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
header.top h1{font-size:22px;margin:0}
.tickets{display:flex;gap:6px;flex-wrap:wrap}
.tk{border:0;background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tk.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.tk .picked{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}
.tk.on .picked{background:#fff3;color:inherit}
.qbox{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.qbox h2{margin:0;font-size:18px;text-wrap:balance}
.qbox .q{color:var(--secondary)}
.qbox .vn{font-weight:600;color:var(--accent)}
.qbox ul{margin:2px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.phones{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.phone{background:var(--page);border:1px solid var(--separator);border-radius:30px;overflow:hidden;min-width:0;display:flex;flex-direction:column;min-height:600px;position:relative}
.phone>h3{font-size:12px;color:var(--secondary);margin:10px 16px 0;font-weight:500}
.common{margin-top:22px}
.common>h4{font-size:14px;margin:0 0 10px;color:var(--secondary);font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;gap:8px;min-height:44px}
.nav .t{font-weight:600;font-size:17px;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{color:var(--accent);background:none;border:0;font:inherit;font-weight:500;padding:6px;cursor:pointer;white-space:nowrap}
.btn.red{color:var(--red)}
.circle{width:32px;height:32px;border-radius:50%;background:var(--fill);border:0;color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none;font:inherit}
.large{font-size:30px;font-weight:700;padding:0 16px 8px}
.sect{font-size:13px;color:var(--secondary);padding:12px 28px 6px;display:flex;align-items:center;gap:8px}
.foot{font-size:13px;color:var(--secondary);padding:0 28px 10px;margin-top:-4px}
.group{background:var(--surface);border-radius:12px;margin:0 12px 10px;overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:10px 14px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:var(--inset,58px);right:0;border-top:.5px solid var(--separator)}
.row.plain{--inset:14px}
.row:active{background:var(--press)}
.main{flex:1;min-width:0}
.tp{display:flex;align-items:baseline;gap:6px}
.name{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:13px;color:var(--secondary);flex:none;font-variant-numeric:tabular-nums}
.prev{color:var(--secondary);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:13px;color:var(--secondary)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.needs{background:var(--orange)}.working{background:var(--accent)}.idle{background:var(--gray)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;position:relative;color:#fff}
.av.sm{width:28px;height:28px;font-size:12px}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border:2px solid var(--surface)}
.cl{background:var(--claude)}.cx{background:var(--codex)}
.hi{width:16px;height:16px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none;vertical-align:-3px}
.hi svg{width:10px;height:10px}
.hib{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.hib svg{width:17px;height:17px}
svg.g{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chat{flex:1;padding:6px 14px;display:flex;flex-direction:column;gap:10px}
.me{align-self:flex-end;max-width:82%;background:var(--fill);padding:8px 12px;border-radius:18px}
.tool{font-size:13px;color:var(--secondary)}
.tool b{color:var(--fg);font-weight:500}
.head{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.head .t{font-weight:600;font-size:16px}
.head .s{font-size:12px;color:var(--secondary);display:flex;align-items:center;gap:4px;white-space:nowrap}
.composer{margin:6px 12px 12px;background:var(--surface);border-radius:22px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.composer .txt{min-height:22px}
.composer .ph{color:var(--tertiary)}
.tools{display:flex;align-items:center;gap:8px}
.tools .sp{flex:1}
.round{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;font-size:16px;cursor:pointer;flex:none}
.attach{background:var(--fill);color:var(--fg)}.send{background:var(--accent);color:var(--on-accent)}
.pill{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:inherit;font-size:14px;font-weight:600;padding:6px 14px;cursor:pointer;white-space:nowrap}
.pill.soft{background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--fill);color:var(--fg)}
.pill.sm{font-size:13px;padding:5px 11px}
.chipx{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--fill);padding:5px 11px;font-size:13px;font-weight:600;border:0;color:var(--fg);font-family:inherit;cursor:pointer;white-space:nowrap}
.chipx.acc{background:var(--accent-soft);color:var(--accent)}
.chipx.org{background:var(--orange-soft);color:var(--orange)}
.chipx.red{background:var(--red-soft);color:var(--red)}
.card{background:var(--surface);border-radius:14px;padding:12px;margin:0 12px 8px;display:flex;flex-direction:column;gap:8px}
.card .h{display:flex;align-items:center;gap:8px;font-weight:600}
.banner{margin:0 12px 8px;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px}
.banner.org{background:var(--orange-soft)}
.banner.gray{background:var(--fill)}
.banner.red{background:var(--red-soft)}
.banner .main b{display:block}
.ring{width:30px;height:30px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--fill)}.ring .fgc{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ringtxt{font:600 11px/1 -apple-system,sans-serif;fill:var(--fg)}
.pending{opacity:.6;outline:1.5px dashed var(--secondary);outline-offset:2px}
.under{align-self:flex-end;font-size:13px;color:var(--secondary);display:flex;gap:10px;align-items:center;margin-top:-6px}
.under a{color:var(--accent);font-weight:600;text-decoration:none;cursor:pointer}
.ov{position:absolute;inset:0;background:var(--shade);z-index:4;display:flex;flex-direction:column;justify-content:flex-end}
.ov.center{justify-content:center;align-items:center}
.alert{width:270px;background:var(--surface);border-radius:14px;overflow:hidden;text-align:center}
.alert .b{padding:16px 16px 14px}
.alert .b b{display:block;font-size:17px;margin-bottom:4px}
.alert .b span{font-size:13px}
.alert button{display:block;width:100%;border:0;border-top:.5px solid var(--separator);background:none;color:var(--accent);font:inherit;font-size:17px;padding:11px;cursor:pointer}
.alert button.bold{font-weight:600}
.sheet{background:var(--page);border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:12px}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--tertiary);margin:6px auto 0}
.big{margin:0 12px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;font-size:17px;min-height:50px;cursor:pointer}
.big.gray{background:var(--fill);color:var(--fg)}
.big+.big{margin-top:8px}
.menu{position:absolute;background:var(--surface);border-radius:14px;box-shadow:0 10px 40px #0004;overflow:hidden;z-index:5;min-width:220px}
.menu .row{padding:10px 14px;--inset:14px}
.menu .row.sel{font-weight:600}
.ck{color:var(--accent);font-weight:700;width:16px;flex:none}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:0 12px 10px}
.seg span{flex:1;text-align:center;padding:6px 4px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
.seg span.on{background:var(--surface);box-shadow:0 1px 3px #0002;font-weight:600}
.seg.in{margin:0}
.bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.o{background:var(--orange)}.bar i.r{background:var(--red)}
.mini{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--secondary);font-variant-numeric:tabular-nums}
.mini.o{color:var(--orange);font-weight:600}
.todo{display:flex;flex-direction:column;gap:4px;font-size:14px}
.todo div{display:flex;gap:8px;align-items:center}
.todo .d{color:var(--secondary);text-decoration:line-through}
.box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--secondary);flex:none;display:grid;place-items:center;font-size:11px}
.box.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.box.now{border-color:var(--accent)}
.divider{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--secondary)}
.divider::before,.divider::after{content:"";flex:1;border-top:.5px solid var(--separator)}
.diff{font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--surface);margin:0 12px 8px;border-radius:12px;overflow:hidden}
.diff .fh{font:600 13px/1.3 -apple-system,sans-serif;padding:9px 12px;display:flex;gap:8px;align-items:center;border-bottom:.5px solid var(--separator)}
.diff .ln{display:flex;white-space:pre;overflow:hidden}
.diff .ln i{font-style:normal;width:30px;flex:none;text-align:right;padding-right:6px;color:var(--tertiary)}
.diff .ln.a{background:var(--add)}.diff .ln.d{background:var(--del)}
.diff .ln.sel{box-shadow:inset 3px 0 var(--accent)}
.cmt{font:14px/1.4 -apple-system,"PingFang TC",sans-serif;margin:6px 10px 8px 36px;background:var(--page);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;white-space:normal}
.cmt .who{font-size:12px;color:var(--secondary)}
.stt{font:700 11px/1 ui-monospace,Menlo,monospace;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none}
.stt.M{background:var(--orange-soft);color:var(--orange)}.stt.A{background:var(--accent-soft);color:var(--accent)}.stt.D{background:var(--red-soft);color:var(--red)}
.num{font-variant-numeric:tabular-nums;font-size:12px}
.plus{color:var(--accent)}.minus{color:var(--red)}
.mark{background:var(--orange-soft);border-bottom:2px solid var(--orange);border-radius:3px;padding:0 2px}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003}
.toggle.on{background:var(--accent)}.toggle.on::after{left:22px}
.toggle.off{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.grid span{aspect-ratio:1;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.grid span.on{outline:2.5px solid var(--accent);outline-offset:2px}
.handle{color:var(--tertiary);font-size:18px;flex:none}
.toast{position:absolute;left:12px;right:12px;top:58px;background:var(--surface);border-radius:14px;box-shadow:0 8px 30px #0003;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px;z-index:3}
.chev{color:var(--tertiary);flex:none}
.val{color:var(--secondary);font-size:15px;white-space:nowrap}
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bar-bg);color:var(--bar-fg);border-radius:999px;padding:6px;display:flex;gap:2px;align-items:center;box-shadow:0 6px 24px #0005;z-index:9;max-width:calc(100% - 32px)}
.switcher button{background:none;border:0;color:inherit;font:600 14px/1 -apple-system,sans-serif;padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.switcher .label{padding:0 6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.switcher .choose{background:var(--accent);color:var(--on-accent)}
.switcher .choose.done{background:transparent;outline:1.5px solid currentColor}
.picks{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.picks textarea{width:100%;min-height:220px;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--page);color:var(--fg);border:.5px solid var(--separator);border-radius:10px;padding:10px}
.picks .rowp{display:flex;gap:10px;align-items:baseline;border-bottom:.5px solid var(--separator);padding-bottom:8px}
.picks .rowp b{width:54px;flex:none}
.picks input{flex:1;min-width:0;font:inherit;background:var(--page);color:var(--fg);border:.5px solid var(--separator);border-radius:8px;padding:6px 8px}
button:focus-visible,.row:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Purrdr 待定畫面</h1>
    <nav class="tickets" id="tickets" aria-label="票"></nav>
  </header>
  <main id="stage"></main>
</div>
<div class="switcher" id="switcher">
  <button id="prev" aria-label="上一個版本">←</button>
  <span class="label" id="vlabel"></span>
  <button id="next" aria-label="下一個版本">→</button>
  <button class="choose" id="choose">選這個</button>
</div>

<script>
const G = {
  host:'<svg class="g" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="9" rx="1.5"/><path d="M7 16.5h6M10 13v3.5"/></svg>',
  clock:'<svg class="g" viewBox="0 0 20 20" width="14" height="14"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2"/></svg>',
  warn:'<svg class="g" viewBox="0 0 20 20" width="18" height="18"><path d="M10 3 2.5 16.5h15z"/><path d="M10 8v4M10 14.2v.1"/></svg>',
  key:'<svg class="g" viewBox="0 0 20 20" width="18" height="18"><circle cx="7" cy="12" r="3.5"/><path d="m9.5 9.5 6-6M13 6l2 2M15.5 3.5l1.5 1.5"/></svg>',
  shield:'<svg class="g" viewBox="0 0 20 20" width="18" height="18"><path d="M10 2.5 4 5v5c0 3.6 2.6 6.4 6 7.5 3.4-1.1 6-3.9 6-7.5V5z"/><path d="M10 7v3.5M10 13v.1"/></svg>',
  up:'↑', wifi:'<svg class="g" viewBox="0 0 20 20" width="18" height="18"><path d="M3 8a10 10 0 0 1 14 0M5.5 10.8a6.5 6.5 0 0 1 9 0M8 13.5a3 3 0 0 1 4 0"/><path d="M3 3l14 14"/></svg>',
  cmt:'<svg class="g" viewBox="0 0 20 20" width="15" height="15"><path d="M4 4h12v9H9l-4 3v-3H4z"/></svg>',
};
const hi = () => `<span class="hi">${G.host}</span>`;
const av = (k='C', s='', sm=false) => `<span class="av ${k==='C'?'cl':'cx'} ${sm?'sm':''}">${k}${s?`<span class="dot ${s}"></span>`:''}</span>`;
const phone = (label, body, extra='') => `<section class="phone"${extra}><h3>${label}</h3>${body}</section>`;
const chatNav = (sub='', right='<button class="circle" aria-label="更多">⋯</button>') =>
  `<div class="nav"><button class="btn" aria-label="返回">‹ 聊天</button><div class="head"><span class="t">ledger</span><span class="s">${sub || `${hi()} Studio Mac · Claude Code`}</span></div>${right}</div>`;
const convo = () => `<div class="me">CSV 匯出遇到逗號會壞掉，幫我修</div>
  <div class="tool">讀取 <b>CSVExport.swift</b></div>
  <div class="tool">編輯 <b>CSVExport.swift</b> · +12 −3</div>
  <div>欄位裡有逗號、雙引號或換行時，現在會用雙引號包起來，裡面的雙引號改成兩個。測試也補上了，全部通過。</div>`;
const composer = (text='', o={}) => `<div class="composer"${o.style?` style="${o.style}"`:''}>
  <div class="txt">${text || `<span class="ph">${o.ph||'傳訊息給 Claude'}</span>`}</div>
  <div class="tools"><button class="round attach" aria-label="附加">＋</button>${o.left||''}<span class="sp"></span>${o.send ?? `<button class="round send" aria-label="送出">${G.up}</button>`}</div></div>`;
const ring = (frac, label, color) => `<svg class="ring" viewBox="0 0 30 30" aria-hidden="true"><circle class="bg" cx="15" cy="15" r="12"/><circle class="fgc" cx="15" cy="15" r="12" stroke-dasharray="${(2*Math.PI*12).toFixed(1)}" stroke-dashoffset="${(2*Math.PI*12*(1-frac)).toFixed(1)}"${color?` style="stroke:${color}"`:''}/>${label?`<text class="ringtxt" x="15" y="19" text-anchor="middle">${label}</text>`:''}</svg>`;
const agentRow = (k, name, s, prev, time, tail='') => `<div class="row"><span>${av(k,s)}</span><div class="main"><div class="tp"><span class="name">${name}</span><span class="time">${time}</span></div><div class="prev">${hi()} ${prev}</div>${tail}</div></div>`;
const listNav = () => `<div class="nav"><button class="chipx">${hi()} 所有主機 ▾</button><span></span><span style="display:flex;gap:8px"><button class="circle" aria-label="更多">⋯</button><button class="circle" style="background:var(--accent);color:var(--on-accent);font-weight:700">R</button></span></div><div class="large">聊天</div><div class="seg"><span class="on">Agents</span><span>Spaces</span></div>`;

const T = [
{ id:'300', name:'送出可撤回', q:'送出後的 3 秒倒數、「撤回」與「立即送出」放在哪裡？',
  v:[

// 2026-11-20 使用者已決定的版本(#309、#313 重畫，待選)。
const DECIDED = { '300':'B', '301':'B', '302':'B', '305':'B', '306':'D', '307':'D', '308':'C', '309':'C', '310':'A', '313':'A', '295':'B' };
let picks = {};
try { picks = JSON.parse(localStorage.getItem('purrdr-pending-picks-v2') || '{}'); } catch (e) { picks = {}; }
const save = () => { try { localStorage.setItem('purrdr-pending-picks-v2', JSON.stringify(picks)); } catch (e) {} };
const chosenKey = id => DECIDED[id] || picks[id]?.v;

function parse() {
  const h = location.hash.slice(1);
  if (h === 'picks') return { picks:true };
  const m = /^t(\d+)-([abcd])$/.exec(h);
  const t = m && T.find(x => x.id === m[1]);
  if (t && keysOf(t).includes(m[2].toUpperCase())) return { t:m[1], v:m[2].toUpperCase() };
  const first = T.find(x => !DECIDED[x.id]) || T[0];
  return { t:first.id, v:'A' };
}
function go(t, v) { location.hash = `t${t}-${v.toLowerCase()}`; }

function render() {
  const s = parse();
  document.getElementById('tickets').innerHTML = T.map(t => {
    const k = chosenKey(t.id);
    return `<button class="tk ${s.t===t.id?'on':''}" data-t="${t.id}">#${t.id} ${t.name}${k?`<span class="picked">${DECIDED[t.id]?'✓ ':''}${k==='D'?'定案':k}</span>`:(t.old?'<span class="picked">待選</span>':'')}</button>`;
  }).join('') + `<button class="tk ${s.picks?'on':''}" data-picks="1">彙整選擇</button>`;
  const stage = document.getElementById('stage'), sw = document.getElementById('switcher');
  if (s.picks) { sw.hidden = true; stage.innerHTML = picksView(); bindPicks(); return; }
  sw.hidden = false;
  const t = T.find(x => x.id === s.t), v = vOf(t, s.v);
  const decided = DECIDED[t.id];
  stage.innerHTML = `<section class="qbox"><h2>#${t.id} ${t.name}</h2><div class="q">${t.q}</div>
    ${decided?`<div class="sub">已決定:<b style="color:var(--accent)">${vLabel(t, decided)}</b></div>`:''}
    <div><span class="vn">${vLabel(t, s.v)}</span><ul>${v.pts.map(p=>`<li>${p}</li>`).join('')}</ul></div></section>
    <div class="phones">${v.h()}</div>${t.common?`<div class="common"><h4>各版本共用</h4><div class="phones">${t.common()}</div></div>`:''}`;
  document.getElementById('vlabel').textContent = `#${t.id} ${vLabel(t, s.v)}`;
  const ch = document.getElementById('choose');
  if (decided) { ch.textContent = decided === s.v ? '已決定 ✓' : '已決定其他版本'; ch.classList.add('done'); ch.disabled = true; }
  else { const c = picks[t.id]?.v === s.v; ch.disabled = false; ch.textContent = c ? '已選 ✓' : '選這個'; ch.classList.toggle('done', c); }
}
function picksView() {
  return `<section class="picks"><h2 style="margin:0">彙整選擇</h2><div class="sub">打勾的是已經決定的；#309、#313 是重畫的第 2 版，選好後可補一句想混搭的地方。複製下面的文字貼回對話。</div>
    ${T.map(t=>{ const k = chosenKey(t.id); return `<div class="rowp"><b>#${t.id}</b><span style="width:130px;flex:none">${t.name}</span><span style="width:150px;flex:none;color:${k?'var(--accent)':'var(--secondary)'}">${k?`${DECIDED[t.id]?'✓ ':''}${vLabel(t,k)}`:'還沒選'}</span>${DECIDED[t.id]?'<span class="sub">已決定</span>':`<input id="note-${t.id}" data-note="${t.id}" placeholder="補充(可留空)" value="${(picks[t.id]?.note||'').replace(/"/g,'&quot;')}">`}</div>`; }).join('')}
    <textarea id="summary" readonly aria-label="選擇彙整">${summary()}</textarea>
    <div style="display:flex;gap:8px"><button class="pill" id="copy">複製</button><span class="sub" id="copied"></span></div></section>`;
}
function summary() {
  return T.filter(t => !DECIDED[t.id]).map(t => { const p = picks[t.id]; const v = p?.v ? vLabel(t, p.v) : '未選'; return `#${t.id} ${t.name}:${v}${p?.note?` — ${p.note}`:''}`; }).join('\n');
}
function bindPicks() {
  document.querySelectorAll('[data-note]').forEach(el => el.addEventListener('input', () => {
    const id = el.dataset.note; picks[id] = { ...(picks[id]||{}), note: el.value }; save();
    document.getElementById('summary').value = summary();
  }));
  document.getElementById('copy').addEventListener('click', () => {
    const ta = document.getElementById('summary'), msg = document.getElementById('copied');
    navigator.clipboard.writeText(ta.value).then(() => msg.textContent = '已複製', () => { ta.select(); msg.textContent = '已選取，請手動複製'; });
  });
}
function step(d) { const s = parse(); if (s.picks) return; const t = T.find(x => x.id === s.t), ks = keysOf(t); go(s.t, ks[(ks.indexOf(s.v) + d + ks.length) % ks.length]); }
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('choose').onclick = () => { const s = parse(); if (DECIDED[s.t]) return; picks[s.t] = { ...(picks[s.t]||{}), v: picks[s.t]?.v === s.v ? undefined : s.v }; save(); render(); };
document.getElementById('tickets').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.picks) { location.hash = 'picks'; return; }
  go(b.dataset.t, chosenKey(b.dataset.t) || 'A');
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
});
addEventListener('hashchange', () => { render(); scrollTo({ top: 0 }); });
render();
</script>
