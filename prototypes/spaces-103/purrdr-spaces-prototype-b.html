<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purrdr Spaces 版面原型 B</title>
<style>
/* PROTOTYPE，用完即丟。以 B（依主機分組）為基礎、加上 Agent 種類頭像、每列兩行以上的三個變化。顏色取自 DESIGN.md。 */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#E9E9EE; --fg:#000000; --muted:#636366; --sep:rgba(60,60,67,.18);
  --brand:#D80521; --brandFill:#EA0826; --working:#C25E00; --done:#0A7E8C; --idle:#248A3D; --needs:#D80521;
  --chip:#E5E5EA; --page:#DCDCE2; --bar:#1C1C1E; --barFg:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fg:#FFFFFF; --muted:#AEAEB2; --sep:rgba(84,84,88,.55);
  --brand:#FC5D72; --working:#FF9F0A; --done:#40C8E0; --idle:#30D158; --needs:#FC5D72;
  --chip:#2C2C2E; --page:#111113; --bar:#F2F2F7; --barFg:#000000; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 110px}
.wrap{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:32px;align-items:start}
.notes{min-width:0;position:sticky;top:24px}
.notes h1{font-size:28px;margin:0 0 4px}
.notes .kicker{color:var(--muted);font-size:13px;letter-spacing:.04em;margin:0 0 20px}
.notes h2{font-size:20px;margin:0 0 8px}
.notes p,.notes li{line-height:1.6;max-width:62ch}
.notes ul{padding-left:20px;margin:8px 0}
.phone{width:390px;max-width:100%;height:780px;border-radius:44px;background:var(--bg);overflow:hidden;position:relative;
  box-shadow:0 0 0 10px #000,0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.phone{order:-1;margin:0 auto;height:720px;border-radius:32px;box-shadow:0 0 0 6px #000}.notes{position:static}}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:600}
.toolbar{flex:none;display:flex;align-items:center;gap:10px;padding:4px 16px 0}
.tb-btn{width:44px;height:44px;border-radius:22px;background:var(--surface2);display:grid;place-items:center;border:0;color:var(--fg);font-size:18px}
.tb-btn.plus{background:var(--brandFill);color:#fff;font-size:26px}
.tb-spacer{flex:1}
.screen{flex:1;overflow-y:auto;padding:0 16px 90px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.big{font-size:34px;font-weight:700;margin:6px 0 4px;display:flex;align-items:center;gap:6px}
.big small{font-size:20px;color:var(--muted);font-weight:600}
.search{position:absolute;left:16px;right:16px;bottom:18px;height:48px;border-radius:24px;background:color-mix(in srgb,var(--surface2) 88%,transparent);
  backdrop-filter:blur(14px);display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.working{background:var(--working)} .dot.done{background:var(--done)} .dot.idle{border:1.5px solid var(--idle)} .dot.needs{background:var(--needs)}
.st{font-size:13px;font-weight:600;white-space:nowrap}
.st.working{color:var(--working)} .st.done{color:var(--done)} .st.idle{color:var(--idle)} .st.needs{color:var(--needs)}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kind{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none;color:#fff;position:relative}
.kind.claude{background:#C96442} .kind.codex{background:#3A3A3C} .kind.gemini{background:#3C6FE0}
.host{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.host .name{font-size:20px;font-weight:700}
.host .sum{margin-left:auto;display:flex;gap:10px;font-size:13px;color:var(--muted)}
.host .sum span{display:inline-flex;align-items:center;gap:4px}
.grid{color:var(--brand);font-size:16px}

/* B1 兩行 */
.b1-group{background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:10px}
.b1-ws{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;font-size:13px;color:var(--muted)}
.b1-ws b{color:var(--fg);font-size:14px}
.b1-ws .grid{margin-left:auto}
.b1-row{display:flex;gap:12px;padding:10px 14px;align-items:center;position:relative}
.b1-row + .b1-row::before{content:"";position:absolute;left:62px;right:0;top:0;height:1px;background:var(--sep)}
.b1-body{flex:1;min-width:0}
.b1-l1,.b1-l2{display:flex;gap:8px;align-items:baseline}
.b1-l1 .t{flex:1;font-size:16px}
.b1-l2{margin-top:2px;font-size:14px}
.b1-l2 .p{flex:1;color:var(--muted)}
.b1-row.needs .t{font-weight:600}

/* B2 寬鬆三行 */
.b2-ws{display:flex;align-items:center;gap:8px;margin:14px 2px 2px;font-size:13px;color:var(--muted)}
.b2-ws b{color:var(--fg);font-size:15px}
.b2-ws .grid{margin-left:auto}
.b2-list{border-left:2px solid var(--sep);margin-left:19px;padding-left:12px}
.b2-row{display:flex;gap:12px;padding:12px 0;align-items:flex-start}
.b2-row + .b2-row{border-top:1px solid var(--sep)}
.b2-av{position:relative;flex:none}
.b2-av .kind{width:40px;height:40px;border-radius:12px;font-size:16px}
.b2-av .badge{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;border:3px solid var(--bg)}
.badge.working{background:var(--working)} .badge.done{background:var(--done)} .badge.idle{background:var(--bg);box-shadow:inset 0 0 0 2px var(--idle)} .badge.needs{background:var(--needs)}
.b2-av.working .kind{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--working) 45%,transparent)}}
@media (prefers-reduced-motion:reduce){.b2-av.working .kind{animation:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--working) 45%,transparent)}}
.b2-body{flex:1;min-width:0}
.b2-l1{display:flex;gap:8px;align-items:flex-start}
.b2-l1 .t{flex:1;font-size:16px;font-weight:600;line-height:1.3}
.b2-p{color:var(--muted);font-size:14px;line-height:1.4;margin-top:3px}
.b2-meta{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.b2-meta .sep{opacity:.6}
.b2-ask{margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--needs) 12%,var(--surface));font-size:14px;line-height:1.4}

/* B3 可收合 workspace */
.b3-group{background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:10px}
.b3-head{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.b3-stack{display:flex;flex:none}
.b3-stack .kind{width:26px;height:26px;font-size:12px;border-radius:8px;border:2px solid var(--surface)}
.b3-stack .kind + .kind{margin-left:-10px}
.b3-hbody{flex:1;min-width:0}
.b3-hbody .t{font-size:16px;font-weight:600}
.b3-hbody .s{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
.b3-chev{color:var(--muted);font-size:12px;transition:transform .15s}
.b3-head[aria-expanded="true"] .b3-chev{transform:rotate(90deg)}
.b3-row{display:flex;gap:12px;padding:10px 14px;align-items:flex-start;position:relative}
.b3-row::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--sep)}
.b3-body{flex:1;min-width:0}
.b3-l1{display:flex;gap:8px;align-items:baseline}
.b3-l1 .t{flex:1;font-size:15px;line-height:1.3}
.b3-row.needs .t{font-weight:600}
.b3-p{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.4}
.b3-st{display:flex;gap:5px;align-items:center;margin-top:4px}

.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;
  display:flex;align-items:center;gap:4px;background:var(--bar);color:var(--barFg);border-radius:999px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.switcher button{width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:inherit;font-size:18px;cursor:pointer}
.switcher .lbl{padding:0 10px;font:600 14px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>

<div class="wrap">
  <section class="notes">
    <h1>Spaces 列表：B 的三個變化</h1>
    <p class="kicker">PROTOTYPE · 用完即丟 · 下方切換列或鍵盤 ← → 切換</p>
    <div id="note"></div>
  </section>
  <div class="phone" role="img" aria-label="iPhone 列表模擬畫面">
    <div class="status"><span>14:26</span><span>43%</span></div>
    <div class="toolbar"><button class="tb-btn" aria-label="主機">🖥</button><div class="tb-spacer"></div>
      <button class="tb-btn" aria-label="更多">⋯</button><button class="tb-btn plus" aria-label="新增對話">+</button></div>
    <div class="screen" id="screen"></div>
    <div class="search">⌕ 搜尋</div>
  </div>
</div>
<nav class="switcher" aria-label="原型切換">
  <button id="prev" aria-label="上一個樣式">‹</button><span class="lbl" id="lbl"></span><button id="next" aria-label="下一個樣式">›</button>
</nav>

<script>
// 範例資料：兩個 workspace 來自截圖；PushService（需要你）是虛構的對照資料。
const hosts = { pc:{name:"Ray PC", icon:"🖥"}, mini:{name:"Ray Mac Mini", icon:"🖥"} };
const workspaces = [
  { id:"w-push", host:"pc", label:"uTagGoClassic.PushService", folder:"TSPCollection", agents:[
    { kind:"claude", title:"推播重送排程修正", status:"needs", time:"現在", preview:"要允許執行 dotnet test --filter PushRetry 嗎？", model:"Opus 5.5" } ]},
  { id:"w-ios", host:"pc", label:"purrdr.ios", folder:"Desktop\\Source", agents:[
    { kind:"claude", title:"UAT 分支 git pull", status:"working", time:"現在", preview:"手動用 Debug 建置驗證中，跑到 PurrdrFeaturesTests…", model:"Opus 5.5" },
    { kind:"claude", title:"allymote-releases HTTP 下載", status:"done", time:"14:20", preview:"PR #87 已經合併，TestFlight 上傳中", model:"Sonnet 5.5" },
    { kind:"codex",  title:"azure-mcp-uat-auth 應用程式註冊與權限設定", status:"done", time:"14:06", preview:"已建立 App Registration，等你確認 Graph 權限", model:"gpt-5" } ]},
  { id:"w-trip", host:"mini", label:"trip-planner.flutter", folder:"ray/Projects", agents:[
    { kind:"claude", title:"Herdrchat iOS 聊天終端機 App", status:"idle", time:"07:47", preview:"太好了，TestFlight 已可以安裝，下一步要做推播嗎？", model:"Opus 5.5" },
    { kind:"claude", title:"地圖 POI tab 玻璃風格設計", status:"idle", time:"07:04", preview:"0.42.0 已上傳到 TestFlight", model:"Opus 5.5" },
    { kind:"gemini", title:"API repo 新導入", status:"done", time:"昨天", preview:"README 與 CI 設定完成", model:"Gemini 3" },
    { kind:"claude", title:"行程匯出 PDF", status:"idle", time:"昨天", preview:"版面調整好了，要再看一次嗎？", model:"Sonnet 5.5" } ]},
];
const stText = {needs:"需要你", working:"工作中", done:"完成", idle:"閒置"};
const kindName = {claude:"Claude Code", codex:"Codex", gemini:"Gemini CLI"};
const kindLetter = {claude:"C", codex:"X", gemini:"G"};
const rank = {needs:0, working:1, done:2, idle:3};
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const byStatus = list => [...list].sort((x,y)=>rank[x.status]-rank[y.status]);
const wsStatus = ws => byStatus(ws.agents)[0].status;
const kind = (a, extra="") => `<span class="kind ${a.kind}" ${extra}>${kindLetter[a.kind]}</span>`;
const statusLabel = a => `<span class="dot ${a.status}"></span><span class="st ${a.status}">${a.status==="needs"?"! ":""}${stText[a.status]}</span>`;
function hostHeader(h){
  const counts = {}; workspaces.filter(ws=>ws.host===h).forEach(ws => ws.agents.forEach(a => counts[a.status]=(counts[a.status]||0)+1));
  const sum = ["needs","working","done","idle"].filter(s=>counts[s]).map(s=>`<span><span class="dot ${s}"></span>${counts[s]}</span>`).join("");
  return `<div class="host"><span aria-hidden="true">${hosts[h].icon}</span><span class="name">${esc(hosts[h].name)}</span><span class="sum">${sum}</span></div>`;
}
const perHost = fn => `<div class="big">Spaces <small>⌄</small></div>` +
  Object.keys(hosts).map(h => hostHeader(h) + workspaces.filter(ws=>ws.host===h).map(fn).join("")).join("");

const variants = [
{ key:"B1", name:"兩行",
  note:`<h2>B1 · 兩行</h2>
  <p>每列兩行：第一行頭像、標題、時間；第二行預覽與狀態字。workspace 是群組卡片頂端的小字標頭，右側有版面圖鈕。</p>
  <ul><li>在 B 原本的密度上加回預覽，一個畫面約 7–8 列。</li>
  <li>頭像顏色代表 Agent 種類（C = Claude Code、X = Codex、G = Gemini CLI），VoiceOver 不念，種類名稱放在無障礙標籤裡。</li>
  <li>狀態放在預覽行尾，跟時間上下對齊。</li></ul>`,
  render(){ return perHost(ws => `<div class="b1-group">
    <div class="b1-ws"><b>${esc(ws.label)}</b><span class="ell">${esc(ws.folder)}</span><span class="grid" aria-label="版面圖">▦</span></div>
    ${byStatus(ws.agents).map(a => `<div class="b1-row ${a.status}">${kind(a)}<div class="b1-body">
      <div class="b1-l1"><span class="t ell">${esc(a.title)}</span><span class="time">${a.time}</span></div>
      <div class="b1-l2"><span class="p ell">${esc(a.preview)}</span>${statusLabel(a)}</div></div></div>`).join("")}</div>`); }},

{ key:"B2", name:"寬鬆三行",
  note:`<h2>B2 · 寬鬆三行</h2>
  <p>不用卡片底色，改成一般列表加左側細線串起同一個 workspace。每列最多四行：標題可以折兩行、預覽折兩行，最下面一行是 Agent 種類 · 模型 · 時間。</p>
  <ul><li>狀態變成頭像右下角的徽章；工作中的頭像外圈會呼吸（開啟「減少動態效果」時改成靜止外框）。</li>
  <li>「需要你」的列多一塊淡紅底的問題摘要，不點進去也看得到在問什麼。</li>
  <li>資訊最完整，但一個畫面大約只放得下 4–5 列。</li></ul>`,
  render(){ return perHost(ws => `
    <div class="b2-ws"><b>${esc(ws.label)}</b><span class="ell">${esc(ws.folder)}</span><span class="grid" aria-label="版面圖">▦</span></div>
    <div class="b2-list">${byStatus(ws.agents).map(a => `<div class="b2-row">
      <div class="b2-av ${a.status}">${kind(a)}<span class="badge ${a.status}"></span></div>
      <div class="b2-body">
        <div class="b2-l1"><span class="t clamp2">${esc(a.title)}</span><span class="time">${a.time}</span></div>
        ${a.status==="needs" ? `<div class="b2-ask"><span class="st needs">! 需要你</span> ${esc(a.preview)}</div>` : `<div class="b2-p clamp2">${esc(a.preview)}</div>`}
        <div class="b2-meta"><span class="st ${a.status}">${stText[a.status]}</span><span class="sep">·</span>${kindName[a.kind]}<span class="sep">·</span>${esc(a.model)}</div>
      </div></div>`).join("")}</div>`); }},

{ key:"B3", name:"可收合",
  note:`<h2>B3 · workspace 可收合</h2>
  <p>每個 workspace 是一列可收合的標頭：收起時顯示疊在一起的頭像、Agent 數與最急迫的狀態；展開後每個 Agent 三行（標題、預覽、狀態）。</p>
  <ul><li>預設只展開有「需要你」或「工作中」的 workspace，閒置的收起來，所以列表短、重點在上面。</li>
  <li>只有一個 Agent 的 workspace 不收合，直接是一列。</li>
  <li>版面圖改成長按 workspace 標頭的選單項目。</li></ul>`,
  open:null,
  render(){
    if(!this.open){ this.open = new Set(workspaces.filter(ws => ["needs","working"].includes(wsStatus(ws))).map(ws=>ws.id)); }
    const row = a => `<div class="b3-row ${a.status}">${kind(a)}<div class="b3-body">
        <div class="b3-l1"><span class="t clamp2">${esc(a.title)}</span><span class="time">${a.time}</span></div>
        <div class="b3-p clamp2">${esc(a.preview)}</div>
        <div class="b3-st">${statusLabel(a)}<span class="time">· ${kindName[a.kind]}</span></div></div></div>`;
    return perHost(ws => {
      if(ws.agents.length===1){ const a = ws.agents[0];
        return `<div class="b3-group"><div class="b3-row ${a.status}" style="padding-top:12px">${kind(a)}<div class="b3-body">
          <div class="b3-l1"><span class="t clamp2">${esc(a.title)}</span><span class="time">${a.time}</span></div>
          <div class="b3-p clamp2">${esc(a.preview)}</div>
          <div class="b3-st">${statusLabel(a)}<span class="time">· ${esc(ws.label)}</span></div></div></div></div>`; }
      const isOpen = this.open.has(ws.id), s = wsStatus(ws);
      const active = ws.agents.filter(a=>a.status==="working"||a.status==="needs").length;
      return `<div class="b3-group"><button class="b3-head" aria-expanded="${isOpen}" data-ws="${ws.id}">
          <span class="b3-stack">${ws.agents.slice(0,3).map(a=>kind(a)).join("")}</span>
          <span class="b3-hbody"><div class="t ell">${esc(ws.label)}</div>
            <div class="s"><span>${ws.agents.length} 個 Agent${active?`，${active} 個${stText[s]}`:""}</span><span class="dot ${s}"></span><span class="st ${s}">${stText[s]}</span></div></span>
          <span class="b3-chev">▶</span></button>
        ${isOpen ? byStatus(ws.agents).map(row).join("") : ""}</div>`;
    });
  },
  bind(root){
    root.querySelectorAll(".b3-head").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.ws; this.open.has(id) ? this.open.delete(id) : this.open.add(id); show(current); }));
  }},
];

let current = 0;
function show(i){
  current = (i + variants.length) % variants.length;
  const v = variants[current], screen = document.getElementById("screen");
  screen.innerHTML = v.render.call(v);
  if(v.bind) v.bind.call(v, screen);
  document.getElementById("note").innerHTML = v.note;
  document.getElementById("lbl").textContent = `${v.key}（${v.name}）  ${current+1}/${variants.length}`;
  if(location.hash !== "#"+v.key) history.replaceState(null, "", "#"+v.key);
}
document.getElementById("prev").onclick = () => show(current-1);
document.getElementById("next").onclick = () => show(current+1);
document.addEventListener("keydown", e => {
  if(e.key==="ArrowLeft") show(current-1);
  if(e.key==="ArrowRight") show(current+1);
});
const idx = variants.findIndex(v => v.key === location.hash.slice(1).toUpperCase());
show(idx < 0 ? 0 : idx);
</script>
</html>
