<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>標題膠囊與面板</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:900px;height:980px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="col">
<div class="cap">{{t.name}} · 點標題膠囊</div>
<div class="phone {{t.cls}}">
<div class="top">
<button class="ib glass top-l" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div class="top-c"><button class="titlecap one glass" aria-label="purrdr.ios,自動模式,工作中,Ray Mac Mini"><span class="dot work" aria-hidden="true"></span><span class="tn">purrdr.ios</span><span class="tm"><span>自動</span></span></button></div>
<button class="ib glass top-r" aria-label="更多"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
<div class="msgs" style="opacity:.3"><div>我先跑一次 UI 日常組。</div><div class="bubble">好</div></div>
<div class="panel glass">
<div class="ph2">用量 · Claude · Ray Mac Mini</div>
<div style="padding:6px 18px 2px;display:flex;flex-direction:column;gap:12px">
<sc-for list="{{usage}}" as="u" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;justify-content:space-between;align-items:center;font-size:15px"><span>{{u.label}}</span><span style="display:flex;align-items:center;gap:4px"><sc-if value="{{u.warn}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="var(--orange)" role="img" aria-label="接近上限"><path d="M12 2.5l10.5 18.5H1.5L12 2.5zm-1 7v5h2v-5h-2zm0 7v2h2v-2h-2z"></path></svg></sc-if><b style="font-weight:600">{{u.pct}}</b><span style="color:var(--sec)">已用 · {{u.reset}}</span></span></div>
<div class="bar"><div style="width:{{u.pct}};background:{{u.color}}"></div></div>
</div>
</sc-for>
</div>
<div style="display:flex;align-items:center;gap:12px;padding:12px 18px 4px">
<svg width="32" height="32" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14" fill="none" stroke="var(--track)" stroke-width="4"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="var(--u-ok)" stroke-width="4" stroke-linecap="round" stroke-dasharray="37 88" transform="rotate(-90 18 18)"></circle></svg>
<div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:15px">Context <b style="font-weight:600">42%</b> 已用</span><span style="font-size:13px;color:var(--sec)">420k / 1M</span></div>
</div>
<button class="prow"><span style="flex-grow:1">模型</span><span style="color:var(--sec)">Opus 5.5 · 中</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
<button class="prow"><span style="flex-grow:1">待辦</span><span style="color:var(--sec)">2 / 5 完成</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
<button class="prow"><span style="flex-grow:1">背景子 Agent</span><span style="color:var(--sec)">1 個執行中</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
<div class="prow"><label style="flex-grow:1">做完再送</label><span class="toggle" role="switch" aria-checked="false" aria-label="做完再送"></span></div>
<div style="height:1px;background:var(--sep);margin:6px 0"></div>
<div class="ph2">權限模式</div>
<sc-for list="{{modes}}" as="m" hint-placeholder-count="5">
<button class="prow" role="menuitemradio" aria-checked="{{m.on}}"><span style="flex-grow:1">{{m.name}}</span><sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></button>
</sc-for>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const col = (p) => (p >= 85 ? 'var(--u-high)' : p >= 70 ? 'var(--u-warn)' : 'var(--u-ok)');
    const usage = [{ label: '5 小時', p: 38, reset: '14:00 重設' }, { label: '7 天', p: 74, reset: '週四重設' }]
      .map((u) => ({ ...u, pct: u.p + '%', color: col(u.p), warn: u.p >= 70 }));
    return {
      themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }],
      usage,
      modes: [{ name: '一般', on: false }, { name: '接受編輯', on: false }, { name: '規劃', on: false }, { name: '自動', on: true }, { name: '略過權限', on: false }]
    };
  }
}
</script>
</body>
</html>
