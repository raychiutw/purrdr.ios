<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>標題膠囊面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.dark{--bg:#1C1C1E;--card:#2C2C2E;--card2:#3A3A3C;--fill:rgba(120,120,128,.32);--track:rgba(120,120,128,.36);--text:#FFFFFF;--sec:#AEAEB2;--sep:rgba(84,84,88,.65);--accent:#3CCF9E;--on:#000000;--glass:rgba(44,44,46,.86);--glassline:rgba(255,255,255,.14);--orange:#FF9F0A;--bubble:#2C2C2E}
.light{--bg:#FFFFFF;--card:#FFFFFF;--card2:#E5E5EA;--fill:rgba(120,120,128,.16);--track:rgba(120,120,128,.2);--text:#000000;--sec:#636366;--sep:rgba(60,60,67,.29);--accent:#0B7A5C;--on:#FFFFFF;--glass:rgba(255,255,255,.88);--glassline:rgba(0,0,0,.08);--orange:#FF9500;--bubble:#E9E9EB}
.dark{--u-ok:#6FAE98;--u-warn:#C99A6A;--u-high:#C98078;--track:rgba(120,120,128,.28)}
.light{--u-ok:#5E9583;--u-warn:#A9784A;--u-high:#B0645D;--track:rgba(120,120,128,.16)}
.glass{background:var(--glass);border:1px solid var(--glassline);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
</style>
</helmet>
<div style="width:900px;height:980px;box-sizing:border-box;padding:40px;display:flex;gap:40px;background:#E4E4E9">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="font-size:16px;font-weight:600;color:#3A3A3C;height:20px">{{t.name}} · 點標題膠囊</div>
<div class="{{t.cls}}" style="width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);box-shadow:0 0 0 8px #0E0E10">
<div style="position:absolute;top:56px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;z-index:2">
<button aria-label="返回" class="glass" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button aria-expanded="true" class="glass" style="height:52px;min-width:170px;border-radius:26px;padding:0 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text)"><span style="font-size:17px;font-weight:600">purrdr.ios</span><span style="font-size:13px;color:var(--sec)">● 工作中 · Ray Mac Mini</span></button>
<button aria-label="終端機與 Git 變更" class="glass" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
<div style="position:absolute;top:130px;left:20px;right:20px;display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.45;opacity:.35">
<div>我先跑一次 UI 日常組,確認輸入框的兩態切換沒有影響其他流程。</div>
<div style="align-self:flex-end;background:var(--bubble);border-radius:20px;padding:10px 16px">好</div>
<div>日常組跑了 2 分 10 秒,全部通過。</div>
</div>
<div class="glass" style="position:absolute;top:120px;left:20px;right:20px;border-radius:28px;padding:18px 0 8px;box-sizing:border-box;z-index:3">
<div style="padding:0 20px;font-size:13px;font-weight:600;color:var(--sec);letter-spacing:.2px">用量 · Claude</div>
<div style="padding:10px 20px 4px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;justify-content:space-between;font-size:15px"><span>5 小時</span><span><b style="font-weight:600">38%</b> <span style="color:var(--sec)">已用 · 14:00 重設</span></span></div>
<div style="height:6px;border-radius:3px;background:var(--track);overflow:hidden"><div style="width:38%;height:6px;background:var(--u-ok)"></div></div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;justify-content:space-between;font-size:15px"><span>7 天</span><span><b style="font-weight:600">74%</b> <span style="color:var(--sec)">已用 · 週四重設</span></span></div>
<div style="height:6px;border-radius:3px;background:var(--track);overflow:hidden"><div style="width:74%;height:6px;background:var(--u-warn)"></div></div>
</div>
<div style="display:flex;align-items:center;gap:12px;padding:2px 0 6px">
<svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14" fill="none" stroke="var(--track)" stroke-width="4"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="var(--u-ok)" stroke-width="4" stroke-linecap="round" stroke-dasharray="37 88" transform="rotate(-90 18 18)"></circle></svg>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px">Context <b style="font-weight:600">42%</b> 已用</span><span style="font-size:13px;color:var(--sec)">420k / 1M · 3 分鐘前</span></div>
</div>
</div>
<div style="height:1px;background:var(--sep);margin:6px 0 12px"></div>
<div style="padding:0 20px 4px;font-size:13px;font-weight:600;color:var(--sec);letter-spacing:.2px">權限模式</div>
<sc-for list="{{modes}}" as="m" hint-placeholder-count="5">
<button style="width:100%;min-height:48px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;gap:12px;padding:0 20px;font-size:17px;text-align:left">
<span style="flex-grow:1;display:flex;flex-direction:column;gap:1px"><span>{{m.name}}</span><span style="font-size:13px;color:var(--sec)">{{m.desc}}</span></span>
<sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="已選取" role="img"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if>
</button>
</sc-for>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }],
      modes: [
        { name: '一般', desc: '每次動作前先問', on: false },
        { name: '接受編輯', desc: '改檔不問,其他照問', on: false },
        { name: '規劃', desc: '只讀不改,先給計畫', on: false },
        { name: '自動', desc: '自動判斷是否需要問', on: true },
        { name: '略過權限', desc: '這個 session 已啟用', on: false }
      ]
    };
  }
}
</script>
</body>
</html>
