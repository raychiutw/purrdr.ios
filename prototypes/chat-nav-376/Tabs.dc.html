<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>聊天 tab 與切換主機</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1760px;height:980px">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="4">
<div class="col">
<div class="cap">{{s.label}}</div>
<div class="phone {{s.cls}}">
<div class="top">
<div class="top-l" style="top:4px"><button class="hostcap glass" aria-expanded="{{s.menu}}" aria-label="目前主機:所有主機,點兩下更改"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.desk}}"></path></svg>所有主機<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.chevD}}"></path></svg></button></div><div class="top-r" style="display:flex;gap:8px"><div class="grp glass"><button aria-label="檢視:Agents,點兩下切到 Spaces"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.person2}}"></path></svg></button><button aria-label="新增聊天"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.compose}}"></path></svg></button></div><button class="ib glass" aria-label="帳號"><span class="avatar">R</span></button></div>
</div>
<div class="content">
<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg><span>搜尋 Agent</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<button class="row" aria-label="{{r.a11y}}">
<span class="av"><span class="face {{r.kind}}" aria-hidden="true">{{r.av}}</span><span class="sb {{r.st}}" aria-hidden="true">{{r.badge}}</span></span>
<span class="rowbody">
<span class="l1"><span class="name">{{r.title}}<span style="color:var(--sec);font-weight:400"> · {{r.tab}}</span></span><span class="host">{{r.host}}</span><span class="time">{{r.time}}</span></span>
<span class="l2"><span class="pv {{r.pvc}}">{{r.preview}}</span><svg width="16" height="16" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="none" stroke="var(--track)" stroke-width="3"></circle><circle cx="11" cy="11" r="8" fill="none" stroke="{{r.ring}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{r.dash}}" transform="rotate(-90 11 11)"></circle></svg><span class="pct">{{r.pct}}</span></span>
</span>
</button>
</sc-for>
</div>
<sc-if value="{{s.menu}}" hint-placeholder-val="{{false}}">
<div class="mscrim"></div>
<div class="menu glass" style="top:108px;left:16px;width:290px">
<sc-for list="{{hosts}}" as="h" hint-placeholder-count="4">
<button class="mi"><span class="ck"><sc-if value="{{h.on}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="已選取"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></span><span class="mt"><span>{{h.name}}</span><span class="ms">{{h.sub}}</span></span></button>
</sc-for>
<div class="msep"></div>
<button class="mi"><span class="ck"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg><span class="mt">新增主機…</span></button>
</div>
</sc-if>
<nav class="tabbar glass" aria-label="分頁"><sc-for list="{{tabs}}" as="b" hint-placeholder-count="4"><a href="#" class="tab {{b.on}}" aria-current="{{b.cur}}" aria-label="{{b.label}}"><span class="tabicon"><svg width="26" height="24" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{b.icon}}"></path></svg><sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}"><span class="tbadge" aria-hidden="true">{{b.badge}}</span></sc-if></span><span>{{b.name}}</span></a></sc-for></nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      person2: 'M9 11a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z M3 19.5c0-3.2 2.7-5.3 6-5.3s6 2.1 6 5.3 M16.5 10.8a2.6 2.6 0 1 0 0-5.2 M17 14.2c2.5.3 4.5 2.1 4.5 5.3',
      desk: 'M3 4h18v12H3z M8 20h8 M12 16v4', chevD: 'M6 9l6 6 6-6', plus: 'M12 5v14M5 12h14',
      compose: 'M12 5v14M5 12h14'
    };
    const TABS = [['聊天', 'M3 4h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-4 3v-3H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M19 8h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-4a2 2 0 0 1-1.7-1H15a4 4 0 0 0 4-4z'], ['檔案', 'M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z'], ['主機', 'M2 4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v3h3v2H7v-2h3v-3H4a2 2 0 0 1-2-2z'], ['流量', 'M8 2.5l5 5H9.6V15H6.4V7.5H3z M16 21.5l-5-5h3.4V9h3.2v7.5H21z'], ['設定', 'M12 2l2 2.5 3-.8.8 3 2.7 1.3-1 2.9 1 2.9-2.7 1.3-.8 3-3-.8L12 22l-2-2.5-3 .8-.8-3-2.7-1.3 1-2.9-1-2.9L6.2 7.7l.8-3 3 .8z M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z']];
    const tabs = TABS.map(([name, icon], i) => ({ name, icon, on: i === 0 ? 'on' : '', cur: i === 0 ? 'page' : 'false', badge: i === 0 ? 1 : 0, label: i === 0 ? '聊天,1 個 Agent 需要你' : name }));
    const C = 50.3;
    const ST = { need: ['!', '需要你'], work: ['•••', '工作中'], done: ['✓', '完成'] };
    const row = (av, kind, title, tab, st, host, time, pct, preview) => {
      const ring = pct >= 85 ? 'var(--u-high)' : pct >= 70 ? 'var(--u-warn)' : 'var(--u-ok)';
      const pv = st === 'need' ? '需要你:' + preview : preview;
      return { av, kind, title, tab, st, host, time, badge: ST[st][0], pct: pct + '%', ring, dash: (C * pct / 100).toFixed(1) + ' 60', preview: pv, pvc: st === 'need' ? 'need' : '',
        a11y: (kind === 'claude' ? 'Claude Code' : 'Codex') + ',' + title + ',Tab ' + tab + ',' + ST[st][1] + ',' + host + ',' + pv + ',Context ' + pct + '%,' + time };
    };
    const rows = [
      row('C', 'claude', 'weather-app', 'main', 'need', 'Ray Mac Mini', '09:51', 18, '要我直接改 Info.plist 嗎?'),
      row('C', 'claude', 'purrdr.ios', 'tests', 'work', 'Ray Mac Mini', '09:50', 42, '正在跑 UI 日常組…'),
      row('X', 'codex', 'notes', '1', 'work', 'Ray PC', '09:40', 71, '整理 Markdown 匯出格式'),
      row('C', 'claude', 'ledger', 'csv-export', 'done', 'Ray Mac Mini', '昨天', 88, 'CSV 匯出已修好,測試通過'),
      row('C', 'claude', 'trip-planner', '1', 'done', 'Ray PC', '週三', 24, '行程頁改好了')
    ];
    return {
      I, tabs, rows,
      screens: [
        { cls: 'dark', menu: false, label: '深色 · 聊天 tab' },
        { cls: 'dark', menu: true, label: '深色 · 切換目前主機' },
        { cls: 'light', menu: false, label: '淺色 · 聊天 tab' },
        { cls: 'light', menu: true, label: '淺色 · 切換目前主機' }
      ],
      hosts: [
        { name: '所有主機', sub: '合併顯示所有主機的 Agent', on: true },
        { name: 'Ray Mac Mini', sub: 'Tailscale SSH · 線上', on: false },
        { name: 'Ray PC', sub: 'OpenSSH · 線上', on: false },
        { name: 'Build Box', sub: 'HTTPS · 離線', on: false }
      ]
    };
  }
}
</script>
</body>
</html>
