<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>深色底對照</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.black{--bg:#000000;--card:#1C1C1E;--fill:rgba(120,120,128,.32);--track:rgba(120,120,128,.36);--text:#FFFFFF;--sec:#AEAEB2;--sep:rgba(84,84,88,.65);--accent:#3CCF9E;--on:#000000;--glass:rgba(30,30,32,.86);--glassline:rgba(255,255,255,.14);--orange:#FF9F0A;--gray:#8E8E93;--bubble:#1C1C1E}
.lift{--bg:#1C1C1E;--card:#2C2C2E;--fill:rgba(120,120,128,.32);--track:rgba(120,120,128,.36);--text:#FFFFFF;--sec:#AEAEB2;--sep:rgba(84,84,88,.65);--accent:#3CCF9E;--on:#000000;--glass:rgba(58,58,60,.80);--glassline:rgba(255,255,255,.14);--orange:#FF9F0A;--gray:#8E8E93;--bubble:#2C2C2E}
.glass{background:var(--glass);border:1px solid var(--glassline);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
</style>
</helmet>
<div style="width:1760px;height:980px;box-sizing:border-box;padding:40px;display:flex;gap:40px;background:#E4E4E9">
<sc-for list="{{variants}}" as="v" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="font-size:16px;font-weight:600;color:#3A3A3C;height:20px">{{v.name}} · 聊天列表</div>
<div class="{{v.cls}}" style="width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);box-shadow:0 0 0 8px #0E0E10">
<div style="position:absolute;top:56px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between">
<button class="glass" style="height:44px;border-radius:22px;padding:0 14px;color:var(--text);font-size:15px;font-weight:500">Agents ▾</button>
<button class="glass" style="height:44px;border-radius:22px;padding:0 14px;color:var(--text);font-size:15px;font-weight:600">所有主機 ▾</button>
<div class="glass" style="height:44px;border-radius:22px;display:flex;align-items:center;gap:2px;padding:0 4px"><button aria-label="新增聊天" style="width:36px;height:36px;border:none;background:transparent;color:var(--text);font-size:22px;padding:0">+</button><button aria-label="帳號" style="width:32px;height:32px;border-radius:16px;border:none;background:var(--accent);color:var(--on);font-size:14px;font-weight:600;padding:0">R</button></div>
</div>
<div style="position:absolute;top:120px;left:16px;right:16px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="background:var(--card);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center">
<span style="position:relative;width:42px;height:42px;flex-shrink:0"><span style="width:42px;height:42px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-weight:700">{{r.av}}</span><span role="img" aria-label="{{r.status}}" style="position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:10px;background:{{r.dot}};color:{{r.badgeFg}};border:2.5px solid var(--card);box-sizing:border-box;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1">{{r.badge}}</span></span>
<span style="flex-grow:1;display:flex;flex-direction:column;gap:3px"><span style="display:flex;justify-content:space-between"><span style="font-size:16px;font-weight:600">{{r.title}}</span><span style="font-size:13px;color:var(--sec)">{{r.time}}</span></span><span style="font-size:14px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.preview}}</span></span>
</div>
</sc-for>
</div>
<div class="glass" style="position:absolute;left:20px;right:20px;bottom:30px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:space-around;font-size:12px"><span style="color:var(--accent);font-weight:600">聊天</span><span>檔案</span><span>主機</span><span>設定</span></div>
</div>
</div>
</sc-for>
<sc-for list="{{variants}}" as="v" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="font-size:16px;font-weight:600;color:#3A3A3C;height:20px">{{v.name}} · 對話</div>
<div class="{{v.cls}}" style="width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);box-shadow:0 0 0 8px #0E0E10">
<div style="position:absolute;top:56px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between">
<button aria-label="返回" class="glass" style="width:44px;height:44px;border-radius:22px;color:var(--text);font-size:20px;padding:0">‹</button>
<button class="glass" style="height:52px;min-width:170px;border-radius:26px;padding:0 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text)"><span style="font-size:17px;font-weight:600">purrdr.ios</span><span style="font-size:13px;color:var(--sec)">● 完成 · Ray Mac Mini</span></button>
<button aria-label="終端機與 Git 變更" class="glass" style="width:44px;height:44px;border-radius:22px;color:var(--text);font-size:18px;padding:0">⋯</button>
</div>
<div style="position:absolute;top:132px;left:20px;right:20px;display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.45">
<div>CI 失敗的原因是單元測試還在檢查 8 行上限。我已經改成 5 行,現在全部通過。</div>
<div style="background:var(--card);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--sec)">swift test --filter ComposerRules<br>✔ 12 tests passed</div>
<div style="align-self:flex-end;background:var(--bubble);border-radius:20px;padding:10px 16px">幫我開 PR</div>
<div>好,PR 已開好,CI 正在跑。</div>
</div>
<div class="glass" style="position:absolute;left:16px;right:16px;bottom:34px;height:56px;border-radius:28px;display:flex;align-items:center;gap:8px;padding:0 8px;box-sizing:border-box">
<button aria-label="加入" style="width:40px;height:40px;border-radius:20px;border:none;background:var(--fill);color:var(--text);font-size:22px;padding:0">+</button>
<label style="flex-grow:1;font-size:17px;color:var(--sec)">訊息</label>
<button aria-label="送出(停用)" style="width:40px;height:40px;border-radius:20px;border:none;background:var(--fill);color:var(--sec);font-size:18px;padding:0">↑</button>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      variants: [{ cls: 'black', name: '純黑(現況)' }, { cls: 'lift', name: '提亮(建議)' }],
      rows: [
        { av: 'C', title: 'weather-app', time: '09:51', status: '需要你', dot: 'var(--orange)', badge: '!', badgeFg: '#000000', preview: '需要你:要我直接改 Info.plist 嗎?' },
        { av: 'C', title: 'purrdr.ios', time: '09:50', status: '工作中', dot: 'var(--accent)', badge: '•••', badgeFg: '#000000', preview: '正在跑 UI 日常組…' },
        { av: 'X', title: 'notes', time: '09:40', status: '工作中', dot: 'var(--accent)', badge: '•••', badgeFg: '#000000', preview: '整理 Markdown 匯出格式' },
        { av: 'C', title: 'ledger', time: '昨天', status: '完成', dot: 'var(--gray)', badge: '✓', badgeFg: '#FFFFFF', preview: 'CSV 匯出已修好,測試通過' },
        { av: 'C', title: 'trip-planner', time: '週三', status: '完成', dot: 'var(--gray)', badge: '✓', badgeFg: '#FFFFFF', preview: '行程頁改好了' }
      ]
    };
  }
}
</script>
</body>
</html>
