<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>新增聊天</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1330px;height:1880px">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="6">
<div class="col">
<div class="cap">{{s.label}}</div>
<div class="phone {{s.cls}}">
<div class="scrimbg"></div>
<div class="sheet" style="top:48px">
<div class="grabber"></div>
<div class="sheettop"><button class="ib" style="background:var(--fill)" aria-label="取消"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button><div class="st">新增聊天</div><span></span></div>
<div class="gl2">
<div class="card"><button class="cell"><span class="cb"><span class="main">主機</span><span class="val">Ray Mac Mini</span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button></div>
<div class="sh">Agent</div>
<div class="card">
<button class="cell" role="menuitemradio" aria-checked="true"><span class="cb"><span class="main">Claude Code</span><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span></button>
<button class="cell" role="menuitemradio" aria-checked="false"><span class="cb"><span class="main">Codex</span></span></button>
</div>
<div class="sh">資料夾</div>
<div class="card"><button class="cell"><span class="cb"><span class="main mono" style="font-size:15px">~/Projects/purrdr.ios</span><span class="val" style="font-size:15px">在主機上選擇</span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button></div>
<div class="sh">第一則訊息</div>
<div class="card" style="min-height:110px;padding:12px 16px;font-size:17px;line-height:1.4">幫我看一下輸入框在 iPad 上的版面<sc-if value="{{s.caret}}" hint-placeholder-val="{{true}}"><span class="caret"></span></sc-if></div>
<sc-if value="{{s.err}}" hint-placeholder-val="{{false}}"><div style="display:flex;align-items:flex-start;gap:8px;padding:12px 6px 0;font-size:15px;line-height:1.4"><svg width="16" height="16" viewBox="0 0 24 24" fill="var(--red)" aria-hidden="true" style="margin-top:2px;flex-shrink:0"><path d="M12 2.5l10.5 18.5H1.5L12 2.5zm-1 7v5h2v-5h-2zm0 7v2h2v-2h-2z"></path></svg><span>建立失敗:herdr 找不到這個資料夾。換一個資料夾再試一次。</span></div></sc-if>
</div>
<div style="position:absolute;left:16px;right:16px;bottom:34px"><button class="btn-prom" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;opacity:{{s.btnOp}}" disabled="{{s.busy}}"><sc-if value="{{s.busy}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></sc-if>{{s.btn}}</button></div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":1880}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [
      { n: '新增聊天', caret: true, err: false, busy: false, btn: '開始聊天', btnOp: 1 },
      { n: '建立中', caret: false, err: false, busy: true, btn: '建立中…', btnOp: 0.6 },
      { n: '建立失敗', caret: false, err: true, busy: false, btn: '再試一次', btnOp: 1 }
    ];
    const screens = [];
    for (const cls of ['dark', 'light']) for (const s of S) screens.push({ ...s, cls, label: (cls === 'dark' ? '深色' : '淺色') + ' · ' + s.n });
    return { screens };
  }
}
</script>
</body>
</html>
