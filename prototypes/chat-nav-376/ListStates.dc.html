<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>列表的載入與搜尋</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1330px;height:1880px">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="6">
<div class="col">
<div class="cap">{{s.label}}</div>
<div class="phone {{s.cls}} {{s.grp}}">
<div class="top">
<sc-if value="{{s.searching}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:0;right:0;top:4px;display:flex;align-items:center;gap:8px"><div class="search" style="margin:0;flex-grow:1;height:44px;color:var(--text)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg><span>pur<span class="caret"></span></span></div><button class="btn-plain" style="padding:0 4px">取消</button></div></sc-if>
<sc-if value="{{s.bar}}" hint-placeholder-val="{{true}}">
<button class="ib glass top-l" aria-label="檢視:Agents,點兩下切到 Spaces"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z M3 19.5c0-3.2 2.7-5.3 6-5.3s6 2.1 6 5.3 M16.5 10.8a2.6 2.6 0 1 0 0-5.2 M17 14.2c2.5.3 4.5 2.1 4.5 5.3"></path></svg></button>
<div class="top-c"><button class="hostcap glass">所有主機<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
<div class="grp glass top-r"><button aria-label="新增聊天"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6 M9.5 14.5l.8-3.3 8.4-8.4a1.8 1.8 0 0 1 2.5 2.5l-8.4 8.4z"></path></svg></button><button aria-label="帳號"><span class="avatar">R</span></button></div>
</sc-if>
</div>
<sc-if value="{{s.skel}}" hint-placeholder-val="{{false}}">
<div class="content" aria-label="載入中">
<sc-for list="{{five}}" as="x" hint-placeholder-count="5"><div class="row"><span class="skel" style="width:44px;height:44px;border-radius:13px;flex-shrink:0"></span><span class="rowbody"><span class="skel" style="height:15px;width:60%"></span><span class="skel" style="height:13px;width:85%"></span></span></div></sc-for>
</div>
</sc-if>
<sc-if value="{{s.connecting}}" hint-placeholder-val="{{false}}">
<div class="content">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2"><button class="row"><span class="av"><span class="face claude" aria-hidden="true">C</span><span class="sb {{r.st}}" aria-hidden="true">{{r.badge}}</span></span><span class="rowbody"><span class="l1"><span class="name">{{r.title}}</span><span class="host">Ray Mac Mini</span><span class="time">{{r.time}}</span></span><span class="l2"><span class="pv">{{r.preview}}</span></span></span></button></sc-for>
<div class="row" role="status" style="align-items:center"><span style="width:44px;display:flex;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></span><span class="rowbody" style="padding:10px 0"><span style="font-size:17px">Ray PC</span><span class="meta">連線中…(已等 8 秒)</span></span></div>
</div>
</sc-if>
<sc-if value="{{s.spaces}}" hint-placeholder-val="{{false}}">
<div class="gl" style="top:110px">
<div class="sh">所有主機 · 2 個 workspace</div>
<div class="card">
<button class="cell"><span class="lead"><span class="av" style="width:36px;height:36px"><span class="face claude" style="width:36px;height:36px;border-radius:11px;font-size:15px" aria-hidden="true">C</span><span class="sb work" style="border-color:var(--card)" aria-hidden="true">•••</span></span></span><span class="cb"><span class="main"><span><mark style="background:var(--fill);color:inherit;border-radius:4px">pur</mark>rdr.ios · Tab 1</span><span class="sub">Ray Mac Mini · Claude Code</span></span></span></button>
<button class="cell"><span class="lead"><span class="av" style="width:36px;height:36px"><span class="face codex" style="width:36px;height:36px;border-radius:11px;font-size:15px" aria-hidden="true">X</span><span class="sb done" style="border-color:var(--card)" aria-hidden="true">✓</span></span></span><span class="cb"><span class="main"><span><mark style="background:var(--fill);color:inherit;border-radius:4px">pur</mark>rdr.host · Tab 1</span><span class="sub">Ray PC · Codex</span></span></span></button>
</div>
</div>
<div class="kb"><sc-for list="{{kb}}" as="r" hint-placeholder-count="4"><div class="kr"><sc-for list="{{r.keys}}" as="k" hint-placeholder-count="10"><div class="key" style="width:{{k.w}}px"></div></sc-for></div></sc-for></div>
</sc-if>
<sc-if value="{{s.bar}}" hint-placeholder-val="{{true}}">
<nav class="tabbar glass" aria-label="分頁"><sc-for list="{{tabs}}" as="b" hint-placeholder-count="4"><a href="#" class="tab {{b.on}}" aria-current="{{b.cur}}" aria-label="{{b.label}}"><span class="tabicon"><svg width="26" height="24" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{b.icon}}"></path></svg><sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}"><span class="tbadge" aria-hidden="true">{{b.badge}}</span></sc-if></span><span>{{b.name}}</span></a></sc-for></nav>
</sc-if>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":1880}}'>
class Component extends DCLogic {
  renderVals() {
    const TABS = [['聊天', 'M3 4h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-4 3v-3H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M19 8h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-4a2 2 0 0 1-1.7-1H15a4 4 0 0 0 4-4z'], ['檔案', 'M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z'], ['主機', 'M2 4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v3h3v2H7v-2h3v-3H4a2 2 0 0 1-2-2z'], ['流量', 'M8 2.5l5 5H9.6V15H6.4V7.5H3z M16 21.5l-5-5h3.4V9h3.2v7.5H21z'], ['設定', 'M12 2l2 2.5 3-.8.8 3 2.7 1.3-1 2.9 1 2.9-2.7 1.3-.8 3-3-.8L12 22l-2-2.5-3 .8-.8-3-2.7-1.3 1-2.9-1-2.9L6.2 7.7l.8-3 3 .8z M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z']];
    const tabs = TABS.map(([name, icon], i) => ({ name, icon, on: i === 0 ? 'on' : '', cur: i === 0 ? 'page' : 'false', badge: i === 0 ? 1 : 0, label: i === 0 ? '聊天,1 個 Agent 需要你' : name }));
    const row = (n, w) => ({ keys: Array.from({ length: n }, () => ({ w })) });
    const S = [
      { n: '第一次載入', bar: true, skel: true, connecting: false, spaces: false, searching: false, grp: '' },
      { n: '一台主機連線中', bar: true, skel: false, connecting: true, spaces: false, searching: false, grp: '' },
      { n: 'Spaces 搜尋', bar: false, skel: false, connecting: false, spaces: true, searching: true, grp: 'grouped' }
    ];
    const screens = [];
    for (const cls of ['dark', 'light']) for (const s of S) screens.push({ ...s, cls, label: (cls === 'dark' ? '深色' : '淺色') + ' · ' + s.n });
    return {
      screens, tabs, five: [1, 2, 3, 4, 5],
      rows: [{ title: 'weather-app', time: '09:51', st: 'need', badge: '!', preview: '需要你:要我直接改 Info.plist 嗎?' }, { title: 'purrdr.ios', time: '09:50', st: 'work', badge: '•••', preview: '正在跑 UI 日常組…' }],
      kb: [row(10, 32), row(10, 32), row(9, 34), { keys: [{ w: 84 }, { w: 180 }, { w: 84 }] }]
    };
  }
}
</script>
</body>
</html>
