<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Git 變更與單檔 diff</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1760px;height:980px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="col">
<div class="cap">{{t.name}} · Git 變更清單</div>
<div class="phone {{t.cls}}">
<div class="top">
<button class="ib glass top-l" aria-label="返回 purrdr.ios"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div class="top-c"><div class="plaintitle"><span class="t1">Git 變更</span><span class="t2">fix/composer · 3 個檔案</span></div></div>
</div>
<div class="content" style="top:120px">
<sc-for list="{{changes}}" as="c" hint-placeholder-count="3">
<button class="row" style="align-items:center;padding-top:0" aria-label="{{c.a11y}}">
<span aria-hidden="true" style="width:28px;height:28px;border-radius:8px;background:var(--fill);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center" class="mono">{{c.kind}}</span>
<span class="rowbody" style="padding:11px 0;flex-direction:row;align-items:center;gap:10px"><span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0"><span style="font-size:17px">{{c.name}}</span><span class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.path}}</span></span><span class="mono" style="font-size:13px;display:flex;gap:6px" aria-hidden="true"><b>{{c.plus}}</b><span style="color:var(--sec)">{{c.minus}}</span></span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
</button>
</sc-for>
</div>
<nav class="tabbar glass" aria-label="分頁"><sc-for list="{{tabs}}" as="b" hint-placeholder-count="4"><a href="#" class="tab {{b.on}}" aria-current="{{b.cur}}" aria-label="{{b.label}}"><span class="tabicon"><svg width="26" height="24" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{b.icon}}"></path></svg><sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}"><span class="tbadge" aria-hidden="true">{{b.badge}}</span></sc-if></span><span>{{b.name}}</span></a></sc-for></nav>
</div>
</div>
<div class="col">
<div class="cap">{{t.name}} · 單檔 diff</div>
<div class="phone {{t.cls}}">
<div class="top">
<button class="ib glass top-l" aria-label="返回 Git 變更"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div class="top-c"><div class="plaintitle"><span class="t1">ComposerRules.swift</span><span class="t2">修改 · 新增 6 行、刪除 9 行</span></div></div>
</div>
<div style="position:absolute;top:120px;left:0;right:0;bottom:110px;font-size:13px;line-height:1.7;overflow:hidden" class="mono">
<div style="padding:6px 16px;color:var(--sec);background:var(--code)">@@ -81,14 +81,11 @@</div>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="14">
<div style="display:flex;background:{{l.bg}};color:{{l.fg}};font-weight:{{l.w}};text-decoration:{{l.deco}}"><span style="width:30px;text-align:right;padding-right:8px;color:var(--sec);flex-shrink:0;font-weight:400;text-decoration:none">{{l.no}}</span><span style="width:14px;flex-shrink:0">{{l.sign}}</span><span style="white-space:pre;overflow:hidden">{{l.text}}</span></div>
</sc-for>
</div>
<nav class="tabbar glass" aria-label="分頁"><sc-for list="{{tabs}}" as="b" hint-placeholder-count="4"><a href="#" class="tab {{b.on}}" aria-current="{{b.cur}}" aria-label="{{b.label}}"><span class="tabicon"><svg width="26" height="24" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{b.icon}}"></path></svg><sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}"><span class="tbadge" aria-hidden="true">{{b.badge}}</span></sc-if></span><span>{{b.name}}</span></a></sc-for></nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const TABS = [['聊天', 'M3 4h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-4 3v-3H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M19 8h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-4a2 2 0 0 1-1.7-1H15a4 4 0 0 0 4-4z'], ['檔案', 'M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z'], ['主機', 'M2 4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v3h3v2H7v-2h3v-3H4a2 2 0 0 1-2-2z'], ['流量', 'M8 2.5l5 5H9.6V15H6.4V7.5H3z M16 21.5l-5-5h3.4V9h3.2v7.5H21z'], ['設定', 'M12 2l2 2.5 3-.8.8 3 2.7 1.3-1 2.9 1 2.9-2.7 1.3-.8 3-3-.8L12 22l-2-2.5-3 .8-.8-3-2.7-1.3 1-2.9-1-2.9L6.2 7.7l.8-3 3 .8z M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z']];
    const tabs = TABS.map(([name, icon], i) => ({ name, icon, on: i === 0 ? 'on' : '', cur: i === 0 ? 'page' : 'false', badge: i === 0 ? 1 : 0, label: i === 0 ? '聊天,1 個 Agent 需要你' : name }));
    const changes = [
      { kind: 'M', name: 'ComposerRules.swift', path: 'src/PurrdrAgentFeatures', plus: '+6', minus: '−9', a11y: '修改,ComposerRules.swift,新增 6 行,刪除 9 行' },
      { kind: 'M', name: 'ComposerView.swift', path: 'src/PurrdrFeatures', plus: '+48', minus: '−71', a11y: '修改,ComposerView.swift,新增 48 行,刪除 71 行' },
      { kind: 'A', name: 'ComposerLayoutTests.swift', path: 'tests/PurrdrFeaturesTests', plus: '+92', minus: '', a11y: '新增,ComposerLayoutTests.swift,新增 92 行' }
    ];
    const L = (no, sign, text) => {
      const add = sign === '+', del = sign === '−';
      return { no, sign, text, bg: add ? 'var(--addbg)' : del ? 'var(--delbg)' : 'transparent', fg: del ? 'var(--sec)' : 'var(--text)', w: add ? 700 : 400, deco: del ? 'line-through' : 'none' };
    };
    const lines = [
      L('81', ' ', '  /// 輸入框的行數上限'), L('82', '−', '  static let maxLines = 8'), L('83', '−', '  static let maxShare = 0.4'), L('82', '+', '  static let maxLines = 5'),
      L('84', ' ', ''), L('85', ' ', '  static func height('), L('86', ' ', '    lines: Int,'), L('87', '−', '    available: CGFloat'), L('87', '+', '    lineHeight: CGFloat'),
      L('88', ' ', '  ) -> CGFloat {'), L('89', '−', '    let cap = available * maxShare'), L('89', '+', '    let n = min(lines, maxLines)'), L('90', '+', '    return CGFloat(n) * lineHeight'), L('91', ' ', '  }')
    ];
    return { tabs, changes, lines, themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }] };
  }
}
</script>
</body>
</html>
