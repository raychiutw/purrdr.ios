<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>右上角整合選單</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.dark{--bg:#1C1C1E;--fill:rgba(120,120,128,.32);--text:#FFFFFF;--sec:#AEAEB2;--sep:rgba(84,84,88,.65);--accent:#3CCF9E;--glass:rgba(44,44,46,.88);--glassline:rgba(255,255,255,.14);--bubble:#2C2C2E}
.light{--bg:#FFFFFF;--fill:rgba(120,120,128,.16);--text:#000000;--sec:#636366;--sep:rgba(60,60,67,.29);--accent:#0B7A5C;--glass:rgba(255,255,255,.9);--glassline:rgba(0,0,0,.08);--bubble:#E9E9EB}
.glass{background:var(--glass);border:1px solid var(--glassline);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
</style>
</helmet>
<div style="width:900px;height:980px;box-sizing:border-box;padding:40px;display:flex;gap:40px;background:#E4E4E9">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="font-size:16px;font-weight:600;color:#3A3A3C;height:20px">{{t.name}} · 點右上角 ⋯</div>
<div class="{{t.cls}}" style="width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);box-shadow:0 0 0 8px #0E0E10">
<div style="position:absolute;top:56px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;z-index:2">
<button aria-label="返回" class="glass" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button class="glass" style="height:52px;min-width:170px;border-radius:26px;padding:0 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text)"><span style="font-size:17px;font-weight:600">purrdr.ios</span><span style="font-size:13px;color:var(--sec)">● 完成 · Ray Mac Mini</span></button>
<button aria-label="終端機與 Git 變更" aria-expanded="true" class="glass" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
<div style="position:absolute;top:130px;left:20px;right:20px;display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.45;opacity:.35">
<div>好,PR 已開好,CI 正在跑。</div>
<div style="align-self:flex-end;background:var(--bubble);border-radius:20px;padding:10px 16px">改了哪些檔案?</div>
</div>
<div class="glass" style="position:absolute;top:108px;right:16px;width:250px;border-radius:24px;padding:6px 0;box-sizing:border-box;z-index:3">
<button style="width:100%;min-height:52px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;gap:14px;padding:0 18px;font-size:17px;text-align:left">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"></rect><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"></path></svg>
<span style="flex-grow:1">終端機</span>
</button>
<div style="height:1px;background:var(--sep);margin:0 18px"></div>
<button style="width:100%;min-height:58px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;gap:14px;padding:0 18px;font-size:17px;text-align:left">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 4v10M2 9h10M12 20h10M17 4L7 20"></path></svg>
<span style="flex-grow:1;display:flex;flex-direction:column;gap:1px"><span>Git 變更</span><span style="font-size:13px;color:var(--sec)">fix/composer · 3 個檔案</span></span>
</button>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }] };
  }
}
</script>
</body>
</html>
