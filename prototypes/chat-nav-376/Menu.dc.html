<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>對話的更多選單</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1760px;height:980px">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="4">
<div class="col">
<div class="cap">{{s.label}}</div>
<div class="phone {{s.cls}}">
<div class="top">
<button class="ib glass top-l" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div class="top-c"><button class="titlecap glass" aria-label="{{s.title}},完成,Ray Mac Mini"><span class="t1">{{s.title}}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span><span class="t2"><span class="sb done sm" aria-hidden="true">✓</span><span>完成 · Ray Mac Mini</span></span></button></div>
<button class="ib glass top-r" aria-label="更多" aria-expanded="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
<div class="msgs" style="opacity:.3"><div>好,PR 已開好,CI 正在跑。</div><div class="bubble">改了哪些檔案?</div></div>
<div class="mscrim"></div>
<div class="menu glass" style="top:108px;right:16px;width:270px">
<button class="mi"><span class="ck"></span><span class="mt"><span>Pane 終端機</span><span class="ms">這個 Agent 的畫面</span></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"></rect><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"></path></svg></button>
<button class="mi {{s.gitCls}}" disabled="{{s.gitOff}}"><span class="ck"></span><span class="mt"><span>Git 變更</span><span class="ms">{{s.gitSub}}</span></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.2"></circle><circle cx="6" cy="18" r="2.2"></circle><circle cx="18" cy="8" r="2.2"></circle><path d="M6 8.2v7.6M18 10.2c0 4-6 3-11 6"></path></svg></button>
<button class="mi"><span class="ck"></span><span class="mt"><span>顯示版面</span><span class="ms">這個 Tab 的 Pane 配置</span></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M12 4v16M12 12h9"></path></svg></button>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { title: 'purrdr.ios', gitCls: '', gitOff: false, gitSub: 'fix/composer · 3 個檔案' };
    const off = { title: 'scratch', gitCls: 'dis', gitOff: true, gitSub: '不是 Git 資料夾' };
    return {
      screens: [
        { cls: 'dark', label: '深色 · 更多選單', ...ok },
        { cls: 'dark', label: '深色 · Git 不可用時停用並寫原因', ...off },
        { cls: 'light', label: '淺色 · 更多選單', ...ok },
        { cls: 'light', label: '淺色 · Git 不可用', ...off }
      ]
    };
  }
}
</script>
</body>
</html>
