<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>加入 sheet 與已加入附件</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1760px;height:980px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="col">
<div class="cap">{{t.name}} · 點輸入列的 +</div>
<div class="phone {{t.cls}}">
<div class="msgs" style="opacity:.5"><div>好,PR 已開好,CI 正在跑。</div></div>
<div class="scrimbg"></div>
<div class="sheet inset" style="top:200px">
<div class="grabber"></div>
<div class="sheettop"><button class="ib" style="background:var(--fill)" aria-label="關閉"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button><div class="st">加入</div><span></span></div>
<div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:8px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
<button style="border:none;background:var(--scard);border-radius:18px;height:80px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;font-size:13px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg><span>{{k.name}}</span></button>
</sc-for>
</div>
<div class="sh" style="display:flex;justify-content:space-between;padding:16px 4px 6px"><span>最近的照片</span><span>已選 2</span></div>
<div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:3px;border-radius:14px;overflow:hidden">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="8">
<button aria-label="{{p.label}}" style="aspect-ratio:1;border:none;padding:0;background:{{p.tile}};position:relative;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.35)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>
<sc-if value="{{p.sel}}" hint-placeholder-val="{{false}}"><span style="position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--on);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:2px solid #FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,.35)">{{p.n}}</span></sc-if>
<sc-if value="{{p.unsel}}" hint-placeholder-val="{{true}}"><span style="position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;border:2px solid #FFFFFF;box-sizing:border-box;background:rgba(0,0,0,.28);box-shadow:0 0 0 1px rgba(0,0,0,.45)"></span></sc-if>
</button>
</sc-for>
</div>
<div style="margin-top:auto;padding-top:12px"><button class="btn-prom" style="width:100%">加入 2 個</button></div>
</div>
</div>
</div>
<div class="col">
<div class="cap">{{t.name}} · 已加入附件的輸入列</div>
<div class="phone {{t.cls}}">
<div class="msgs"><div>好,PR 已開好,CI 正在跑。</div></div>
<div class="composer-x glass" style="bottom:310px">
<div style="display:flex;gap:8px;padding:0 4px">
<sc-for list="{{atts}}" as="a" hint-placeholder-count="3">
<span style="position:relative;width:64px;height:64px;border-radius:12px;background:{{a.bg}};display:flex;align-items:center;justify-content:center;color:var(--sec);font-size:11px;flex-direction:column;gap:2px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg><span>{{a.name}}</span><button aria-label="移除 {{a.name}}" style="position:absolute;top:-10px;right:-10px;width:44px;height:44px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center"><span style="width:22px;height:22px;border-radius:11px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button></span>
</sc-for>
</div>
<div class="txt" style="min-height:30px">這兩張是 iPad 上的截圖,幫我看版面<span class="caret"></span></div>
<div style="display:flex;align-items:center;gap:6px">
<button class="cbtn" aria-label="加入"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button class="chip" aria-label="模型 Opus 5.5,投入程度中"><span>Opus 5.5</span><span style="color:var(--sec)">中</span></button>
<span style="flex-grow:1"></span>
<button class="cbtn send" aria-label="送出"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</div>
</div>
<div class="kb"><sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div class="kr"><sc-for list="{{r.keys}}" as="k" hint-placeholder-count="10"><div class="key" style="width:{{k.w}}px"></div></sc-for></div></sc-for></div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const tiles = ['#B9C2C9', '#C9B8A6', '#A9BDB3', '#C3C0CF'];
    const photos = Array.from({ length: 8 }, (_, i) => {
      const n = i === 1 ? 1 : i === 4 ? 2 : 0;
      return { tile: tiles[(i * 3) % 4], sel: n > 0, unsel: n === 0, n, label: n ? '第 ' + (i + 1) + ' 張照片,已選第 ' + n + ' 個' : '第 ' + (i + 1) + ' 張照片' };
    });
    const row = (n, w) => ({ keys: Array.from({ length: n }, () => ({ w })) });
    return {
      themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }],
      kinds: [
        { name: '拍照', icon: 'M4 8h3l2-2.5h6L17 8h3v11H4V8z M12 16.5a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z' },
        { name: '所有照片', icon: 'M3 6h18v13H3z M3 15l5-4.5 4 3.5 3-2.5 6 5 M15.5 9.5h.01' },
        { name: '檔案', icon: 'M6 3h8l5 5v13H6z M14 3v5h5' },
        { name: '貼上', icon: 'M8 5H6v16h12V5h-2 M9 3h6v4H9z' }
      ],
      photos,
      atts: [
        { name: 'IMG_1.png', bg: '#B9C2C9', icon: 'M3 5h18v14H3z M3 16l5-5 4 4 3-3 6 6' },
        { name: 'IMG_2.png', bg: '#C9B8A6', icon: 'M3 5h18v14H3z M3 16l5-5 4 4 3-3 6 6' },
        { name: 'log.txt', bg: 'var(--fill)', icon: 'M6 3h8l5 5v13H6z M14 3v5h5' }
      ],
      rows: [row(10, 32), row(10, 32), row(9, 34), { keys: [{ w: 84 }, { w: 180 }, { w: 84 }] }]
    };
  }
}
</script>
</body>
</html>
