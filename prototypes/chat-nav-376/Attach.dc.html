<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>加入 sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.dark{--bg:#1C1C1E;--sheet:#1C1C1E;--card:#2C2C2E;--fill:rgba(120,120,128,.32);--text:#FFFFFF;--sec:#AEAEB2;--accent:#3CCF9E;--on:#000000;--glass:rgba(58,58,60,.8);--glassline:rgba(255,255,255,.14);--t1:#3A3A3C;--t2:#48484A;--t3:#2E3B37;--t4:#3B3530}
.light{--bg:#FFFFFF;--sheet:#F2F2F7;--card:#FFFFFF;--fill:rgba(120,120,128,.16);--text:#000000;--sec:#636366;--accent:#0B7A5C;--on:#FFFFFF;--glass:rgba(255,255,255,.85);--glassline:rgba(0,0,0,.08);--t1:#D8D8DD;--t2:#C7C7CC;--t3:#CFDDD8;--t4:#E2D9CF}
.glass{background:var(--glass);border:1px solid var(--glassline);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
</style>
</helmet>
<div style="width:900px;height:980px;box-sizing:border-box;padding:40px;display:flex;gap:40px;background:#E4E4E9">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="font-size:16px;font-weight:600;color:#3A3A3C;height:20px">{{t.name}} · 點輸入列的 +</div>
<div class="{{t.cls}}" style="width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#000;color:var(--text);box-shadow:0 0 0 8px #0E0E10">
<div style="position:absolute;inset:0;background:var(--bg);opacity:.55"></div>
<div style="position:absolute;left:0;right:0;top:150px;bottom:0;background:var(--sheet);border-radius:38px 38px 0 0;padding:8px 16px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">
<div style="width:40px;height:5px;border-radius:3px;background:var(--fill);align-self:center"></div>
<div style="display:flex;align-items:center;position:relative;height:44px">
<button aria-label="關閉" class="glass" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none">加入</div>
</div>
<div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:10px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
<button style="border:none;background:var(--card);border-radius:20px;height:84px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0;font-size:13px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg>
<span>{{k.name}}</span>
</button>
</sc-for>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px">
<span style="font-size:15px;font-weight:600">最近的照片</span>
<span style="font-size:15px;color:var(--sec)">已選 2</span>
</div>
<div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:4px;border-radius:14px;overflow:hidden">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="12">
<button aria-label="{{p.label}}" style="aspect-ratio:1;border:none;padding:0;background:{{p.tile}};position:relative;display:flex;align-items:center;justify-content:center;color:var(--sec)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>
<sc-if value="{{p.sel}}" hint-placeholder-val="{{false}}"><span style="position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--on);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:2px solid #FFFFFF">{{p.n}}</span></sc-if>
<sc-if value="{{p.unsel}}" hint-placeholder-val="{{true}}"><span style="position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;border:2px solid #FFFFFF;box-sizing:border-box;background:rgba(0,0,0,.18)"></span></sc-if>
</button>
</sc-for>
</div>
<div style="position:absolute;left:16px;right:16px;bottom:34px">
<button style="width:100%;height:54px;border:none;border-radius:27px;background:var(--accent);color:var(--on);font-size:17px;font-weight:600">加入 2 個</button>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const tiles = ['var(--t1)', 'var(--t2)', 'var(--t3)', 'var(--t4)'];
    const photos = Array.from({ length: 12 }, (_, i) => {
      const n = i === 1 ? 1 : i === 4 ? 2 : 0;
      return { tile: tiles[(i * 3) % 4], sel: n > 0, unsel: n === 0, n, label: n ? '照片,已選第 ' + n + ' 個' : '照片' };
    });
    return {
      themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }],
      kinds: [
        { name: '拍照', icon: 'M4 8h3l2-2.5h6L17 8h3v11H4V8z M12 16.5a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z' },
        { name: '所有照片', icon: 'M3 6h18v13H3z M3 15l5-4.5 4 3.5 3-2.5 6 5 M15.5 9.5h.01' },
        { name: '檔案', icon: 'M6 3h8l5 5v13H6z M14 3v5h5' },
        { name: '貼上', icon: 'M8 5H6v16h12V5h-2 M9 3h6v4H9z' }
      ],
      photos
    };
  }
}
</script>
</body>
</html>
