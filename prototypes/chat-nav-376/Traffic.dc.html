<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>流量 tab</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1760px;height:980px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="col">
<div class="cap">{{t.name}} · 流量 tab</div>
<div class="phone grouped {{t.cls}}">
<div class="top"><div class="grp glass top-r"><button aria-label="帳號"><span class="avatar">R</span></button></div></div>
<div class="largetitle" style="top:104px">網路流量</div>
<div class="gl" style="top:150px">
<div class="card" style="margin-top:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
<span class="meta">11 月(1 日起)</span>
<span style="font-size:34px;font-weight:700">182 MB</span>
<span class="meta">只計算 Purrdr 與主機之間的傳輸</span>
</div>
<div class="sh">依主機</div>
<div class="card">
<sc-for list="{{hosts}}" as="h" hint-placeholder-count="3">
<div class="cell"><span class="cb" style="flex-direction:column;align-items:stretch;gap:6px"><span style="display:flex;justify-content:space-between"><span>{{h.name}}</span><span class="val">{{h.mb}}</span></span><span class="bar"><span style="display:block;height:6px;width:{{h.pct}};background:var(--u-ok)"></span></span></span></div>
</sc-for>
</div>
<div class="sh">依用途</div>
<div class="card">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="4"><div class="cell"><span class="cb"><span class="main">{{k.name}}</span><span class="val">{{k.mb}}</span></span></div></sc-for>
</div>
</div>
<nav class="tabbar glass" aria-label="分頁"><sc-for list="{{tabs}}" as="b" hint-placeholder-count="5"><a href="#" class="tab {{b.on}}" aria-current="{{b.cur}}" aria-label="{{b.label}}"><span class="tabicon"><svg width="26" height="24" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{b.icon}}"></path></svg><sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}"><span class="tbadge" aria-hidden="true">{{b.badge}}</span></sc-if></span><span>{{b.name}}</span></a></sc-for></nav>
</div>
</div>
<div class="col">
<div class="cap">{{t.name}} · 流量 tab(往下捲)</div>
<div class="phone grouped {{t.cls}}">
<div class="top"><div class="top-c"><span style="font-size:17px;font-weight:600">網路流量</span></div><div class="grp glass top-r"><button aria-label="帳號"><span class="avatar">R</span></button></div></div>
<div class="gl">
<div class="sh">過去 6 個月</div>
<div class="card">
<sc-for list="{{months}}" as="m" hint-placeholder-count="6"><div class="cell"><span class="cb"><span class="main">{{m.name}}</span><span class="val">{{m.mb}}</span></span></div></sc-for>
</div>
<div class="sf">不含 Agent 自己在主機上的網路使用,也不含 App Store 與推播。行動網路與 Wi‑Fi 合計。</div>
<div class="card" style="margin-top:20px"><button class="cell danger"><span class="cb" style="justify-content:center">重設統計</span></button></div>
</div>
<nav class="tabbar glass" aria-label="分頁"><sc-for list="{{tabs}}" as="b" hint-placeholder-count="5"><a href="#" class="tab {{b.on}}" aria-current="{{b.cur}}" aria-label="{{b.label}}"><span class="tabicon"><svg width="26" height="24" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{b.icon}}"></path></svg><sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}"><span class="tbadge" aria-hidden="true">{{b.badge}}</span></sc-if></span><span>{{b.name}}</span></a></sc-for></nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const TABS = [['聊天', 'M3 4h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-4 3v-3H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M19 8h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-4a2 2 0 0 1-1.7-1H15a4 4 0 0 0 4-4z'], ['檔案', 'M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z'], ['主機', 'M2 4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v3h3v2H7v-2h3v-3H4a2 2 0 0 1-2-2z'], ['流量', 'M8 2.5l5 5H9.6V15H6.4V7.5H3z M16 21.5l-5-5h3.4V9h3.2v7.5H21z'], ['設定', 'M12 2l2 2.5 3-.8.8 3 2.7 1.3-1 2.9 1 2.9-2.7 1.3-.8 3-3-.8L12 22l-2-2.5-3 .8-.8-3-2.7-1.3 1-2.9-1-2.9L6.2 7.7l.8-3 3 .8z M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z']];
    const tabs = TABS.map(([name, icon], i) => ({ name, icon, on: i === 3 ? 'on' : '', cur: i === 3 ? 'page' : 'false', badge: i === 0 ? 1 : 0, label: i === 0 ? '聊天,1 個 Agent 需要你' : name }));
    return {
      tabs,
      themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }],
      hosts: [{ name: 'Ray Mac Mini', mb: '120 MB', pct: '66%' }, { name: 'Ray PC', mb: '50 MB', pct: '27%' }, { name: 'Build Box', mb: '12 MB', pct: '7%' }],
      kinds: [{ name: '對話與列表', mb: '96 MB' }, { name: 'Pane 終端機', mb: '41 MB' }, { name: '檔案與圖片', mb: '38 MB' }, { name: '其他', mb: '7 MB' }],
      months: [{ name: '11 月', mb: '182 MB' }, { name: '10 月', mb: '310 MB' }, { name: '9 月', mb: '254 MB' }, { name: '8 月', mb: '198 MB' }, { name: '7 月', mb: '120 MB' }, { name: '6 月', mb: '64 MB' }]
    };
  }
}
</script>
</body>
</html>
