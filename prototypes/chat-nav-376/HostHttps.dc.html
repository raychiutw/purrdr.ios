<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>主機 tab:HTTPS 主機</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.dark{--bg:#1C1C1E;--card:#2C2C2E;--fill:rgba(120,120,128,.32);--text:#FFFFFF;--sec:#AEAEB2;--sep:rgba(84,84,88,.65);--accent:#3CCF9E;--on:#000000;--glass:rgba(44,44,46,.86);--glassline:rgba(255,255,255,.14);--red:#FF453A;--toggleon:#3CCF9E}
.light{--bg:#F2F2F7;--card:#FFFFFF;--fill:rgba(120,120,128,.16);--text:#000000;--sec:#636366;--sep:rgba(60,60,67,.29);--accent:#0B7A5C;--on:#FFFFFF;--glass:rgba(255,255,255,.88);--glassline:rgba(0,0,0,.08);--red:#D70015;--toggleon:#0B7A5C}
.glass{background:var(--glass);border:1px solid var(--glassline);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
</style>
</helmet>
<div style="width:900px;height:980px;box-sizing:border-box;padding:40px;display:flex;gap:40px;background:#E4E4E9">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="font-size:16px;font-weight:600;color:#3A3A3C;height:20px">{{t.name}} · HTTPS 主機(有主機服務、無用量)</div>
<div class="{{t.cls}}" style="width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);box-shadow:0 0 0 8px #0E0E10">
<div style="position:absolute;top:56px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;z-index:2">
<span style="width:84px"></span>
<button class="glass" style="height:44px;border-radius:22px;padding:0 14px;display:flex;align-items:center;gap:6px;color:var(--text);font-size:15px;font-weight:600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 7h6M9 11h6"></path></svg>Build Box<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<div class="glass" style="height:44px;border-radius:22px;display:flex;align-items:center;gap:2px;padding:0 4px">
<button aria-label="新增聊天" style="width:36px;height:36px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button aria-label="帳號" style="width:32px;height:32px;border-radius:16px;border:none;background:var(--accent);color:var(--on);font-size:14px;font-weight:600;padding:0">R</button>
</div>
</div>
<div style="position:absolute;top:116px;left:16px;right:16px;bottom:0;display:flex;flex-direction:column;gap:8px;overflow:hidden">
<div style="background:var(--card);border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:12px">
<span style="width:10px;height:10px;border-radius:5px;background:var(--accent)"></span>
<span style="flex-grow:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px">線上</span><span style="font-size:14px;color:var(--sec)">HTTPS · buildbox.tail1234.ts.net</span></span>
</div>
<div style="font-size:13px;color:var(--sec);padding:10px 18px 2px">主機服務</div>
<div style="background:var(--card);border-radius:22px;overflow:hidden">
<div style="min-height:50px;display:flex;align-items:center;padding:0 18px;font-size:17px;border-bottom:solid 1px var(--sep)"><span style="flex-grow:1">版本</span><span style="color:var(--sec)">0.11.0</span></div>
<button style="width:100%;min-height:50px;border:none;background:transparent;color:var(--accent);display:flex;align-items:center;padding:0 18px;font-size:17px;text-align:left;border-bottom:solid 1px var(--sep)">更新到 0.12.0</button>
<div style="min-height:50px;display:flex;align-items:center;padding:0 18px;font-size:17px;border-bottom:solid 1px var(--sep)"><label style="flex-grow:1">自動更新</label><div style="width:52px;height:32px;border-radius:16px;background:var(--toggleon);position:relative"><div style="position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:14px;background:#FFFFFF"></div></div></div>
<button style="width:100%;min-height:50px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;padding:0 18px;font-size:17px;text-align:left"><span style="flex-grow:1">已配對的裝置</span><span style="color:var(--sec)">2</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<div style="font-size:13px;color:var(--sec);padding:10px 18px 2px">這台主機</div>
<div style="background:var(--card);border-radius:22px;overflow:hidden">
<div style="min-height:50px;display:flex;align-items:center;padding:0 18px;font-size:17px;border-bottom:solid 1px var(--sep)"><label style="flex-grow:1">通知</label><div style="width:52px;height:32px;border-radius:16px;background:var(--toggleon);position:relative"><div style="position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:14px;background:#FFFFFF"></div></div></div>
<button style="width:100%;min-height:50px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;padding:0 18px;font-size:17px;text-align:left"><span style="flex-grow:1">編輯主機</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<div style="background:var(--card);border-radius:22px;margin-top:12px"><button style="width:100%;min-height:50px;border:none;background:transparent;color:var(--red);font-size:17px">刪除主機</button></div>
</div>
<nav class="glass" aria-label="分頁" style="position:absolute;left:20px;right:20px;bottom:30px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:1">
<sc-for list="{{tabs}}" as="b" hint-placeholder-count="4">
<a href="#" aria-current="{{b.cur}}" style="flex-grow:1;height:54px;border-radius:27px;background:{{b.bg}};color:{{b.fg}};text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500"><svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg><span>{{b.name}}</span></a>
</sc-for>
</nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = [
      { name: '聊天', icon: 'M4 5h16v11H9l-5 4V5z' },
      { name: '檔案', icon: 'M3 6h6l2 2h10v11H3z' },
      { name: '主機', icon: 'M3 4h18v12H3z M8 20h8 M12 16v4' },
      { name: '設定', icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19 12l2-1-1-3-2 .3-1.5-1.5L17 5l-3-1-1 2h-2L10 4 7 5l.5 2.3L6 8.8 4 8.5l-1 3 2 1v2l-2 1 1 3 2-.3 1.5 1.5L7 21l3 1 1-2h2l1 2 3-1-.5-2.3 1.5-1.5 2 .3 1-3-2-1z' }
    ].map((t, i) => ({ ...t, cur: i === 2 ? 'page' : 'false', bg: i === 2 ? 'var(--fill)' : 'transparent', fg: i === 2 ? 'var(--accent)' : 'var(--text)' }));
    return { themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }], tabs };
  }
}
</script>
</body>
</html>
