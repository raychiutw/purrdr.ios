<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>聊天輸入區</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1760px;height:980px">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="4">
<div class="col">
<div class="cap">{{s.label}}</div>
<div class="phone {{s.cls}}">
<div class="top">
<button class="ib glass top-l" aria-label="返回,另外 1 個 Agent 需要你" style="width:auto;padding:0 12px 0 8px;gap:4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg><span class="sb need sm" aria-hidden="true" style="width:20px;height:20px;border-radius:10px;font-size:12px">1</span></button>
<div class="top-c"><button class="titlecap glass" aria-label="purrdr.ios,自動模式,完成,Ray Mac Mini"><span class="t1">purrdr.ios<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span><span class="t2"><span>⏵⏵ 自動</span><span>·</span><span class="sb done sm" aria-hidden="true">✓</span><span>完成 · Ray Mac Mini</span></span></button></div>
<button class="ib glass top-r" aria-label="更多"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
<div class="msgs">
<sc-if value="{{s.full}}" hint-placeholder-val="{{true}}"><div>CI 失敗的原因是 <span class="mono" style="font-size:15px">ComposerRules</span> 的單元測試還在檢查 8 行上限。</div></sc-if>
<div>我已經把上限改成 5 行,測試也一起更新,現在全部通過。</div>
<div class="bubble">幫我開 PR</div>
<div class="meta" style="align-self:flex-end;margin-top:-8px">09:45</div>
<div>好,PR 已開好,CI 正在跑。</div>
</div>
<sc-if value="{{s.full}}" hint-placeholder-val="{{true}}">
<div class="composer glass">
<button class="cbtn" aria-label="加入"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<label class="ph">訊息</label>
<button class="cbtn off" aria-label="送出,沒有內容時停用" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</div>
</sc-if>
<sc-if value="{{s.kb}}" hint-placeholder-val="{{false}}">
<div class="composer-x glass">
<div class="txt">CI 過了之後幫我合併,再把 CHANGELOG 補上 0.49.0 那段<span class="caret"></span></div>
<div style="display:flex;align-items:center;gap:6px">
<button class="cbtn" aria-label="加入"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button class="chip" aria-label="模型 Opus 5.5,投入程度中,點兩下更改"><span>Opus 5.5</span><span style="color:var(--sec)">中</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<span style="flex-grow:1"></span>
<button class="cbtn send" aria-label="送出"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</div>
</div>
<div class="kb"><sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div class="kr"><sc-for list="{{r.keys}}" as="k" hint-placeholder-count="10"><div class="key" style="width:{{k.w}}px"></div></sc-for></div></sc-for></div>
</sc-if>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (n, w) => ({ keys: Array.from({ length: n }, () => ({ w })) });
    return {
      screens: [
        { cls: 'dark', full: true, kb: false, label: '深色 · 收合(未聚焦、空白)' },
        { cls: 'dark', full: false, kb: true, label: '深色 · 展開(上限 5 行)' },
        { cls: 'light', full: true, kb: false, label: '淺色 · 收合' },
        { cls: 'light', full: false, kb: true, label: '淺色 · 展開' }
      ],
      rows: [row(10, 32), row(10, 32), row(9, 34), { keys: [{ w: 84 }, { w: 180 }, { w: 84 }] }]
    };
  }
}
</script>
</body>
</html>
