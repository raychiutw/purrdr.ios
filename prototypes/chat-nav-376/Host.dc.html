<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>主機 tab</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1760px;height:980px">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="4">
<div class="col">
<div class="cap">{{s.label}}</div>
<div class="phone grouped {{s.cls}}">
<div class="top">
<div class="top-c"><button class="hostcap glass" aria-label="選取中主機:{{s.host}},點兩下更改"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v12H3z M8 20h8 M12 16v4"></path></svg>{{s.host}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
<div class="grp glass top-r"><button aria-label="新增主機"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><button aria-label="帳號"><span class="avatar">R</span></button></div>
</div>
<div class="gl">
<div class="card" style="margin-top:4px"><div class="cell"><span class="cb"><span style="width:10px;height:10px;border-radius:5px;background:var(--accent);flex-shrink:0" aria-hidden="true"></span><span class="main"><span>線上</span><span class="sub">{{s.conn}}</span></span></span></div></div>
<sc-if value="{{s.usage}}" hint-placeholder-val="{{true}}">
<div class="sh">用量</div>
<div class="card" style="padding:12px 16px;display:flex;flex-direction:column;gap:12px">
<sc-for list="{{usage}}" as="u" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:center;font-size:15px"><span>{{u.label}}</span><span style="display:flex;align-items:center;gap:4px"><sc-if value="{{u.warn}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="var(--orange)" role="img" aria-label="接近上限"><path d="M12 2.5l10.5 18.5H1.5L12 2.5zm-1 7v5h2v-5h-2zm0 7v2h2v-2h-2z"></path></svg></sc-if><b style="font-weight:600">{{u.pct}}</b><span style="color:var(--sec)">已用 · {{u.note}}</span></span></div><div class="bar"><div style="width:{{u.pct}};background:{{u.color}}"></div></div></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{s.hs}}" hint-placeholder-val="{{false}}">
<div class="sh">用量</div>
<div class="card"><div class="cell"><span class="cb"><span class="main"><span style="font-size:15px">這台主機的用量要等主機服務支援後才會顯示。</span></span></span></div></div>
<div class="sh">主機服務</div>
<div class="card">
<div class="cell"><span class="cb"><span class="main">版本</span><span class="val">0.11.0</span></span></div>
<button class="cell link"><span class="cb"><span class="main">更新到 0.12.0</span></span></button>
<div class="cell"><span class="cb"><span class="main">自動更新</span><span class="toggle on" role="switch" aria-checked="true" aria-label="自動更新"></span></span></div>
<button class="cell"><span class="cb"><span class="main">已配對裝置</span><span class="val">2</span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button>
</div>
</sc-if>
<div class="sh">這台主機</div>
<div class="card">
<sc-for list="{{s.items}}" as="it" hint-placeholder-count="4">
<button class="cell"><span class="cb"><span class="main">{{it.name}}</span><span class="val">{{it.val}}</span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button>
</sc-for>
</div>
<div class="card" style="margin-top:20px"><button class="cell danger"><span class="cb" style="justify-content:center">移除主機</span></button></div>
</div>
<nav class="tabbar glass" aria-label="分頁"><sc-for list="{{tabs}}" as="b" hint-placeholder-count="4"><a href="#" class="tab {{b.on}}" aria-current="{{b.cur}}" aria-label="{{b.label}}"><span class="tabicon"><svg width="26" height="24" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{b.icon}}"></path></svg><sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}"><span class="tbadge" aria-hidden="true">{{b.badge}}</span></sc-if></span><span>{{b.name}}</span></a></sc-for></nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const TABS = [['聊天', 'M3 4h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-4 3v-3H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M19 8h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-4a2 2 0 0 1-1.7-1H15a4 4 0 0 0 4-4z'], ['檔案', 'M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z'], ['主機', 'M2 4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v3h3v2H7v-2h3v-3H4a2 2 0 0 1-2-2z'], ['流量', 'M8 2.5l5 5H9.6V15H6.4V7.5H3z M16 21.5l-5-5h3.4V9h3.2v7.5H21z'], ['設定', 'M12 2l2 2.5 3-.8.8 3 2.7 1.3-1 2.9 1 2.9-2.7 1.3-.8 3-3-.8L12 22l-2-2.5-3 .8-.8-3-2.7-1.3 1-2.9-1-2.9L6.2 7.7l.8-3 3 .8z M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z']];
    const tabs = TABS.map(([name, icon], i) => ({ name, icon, on: i === 2 ? 'on' : '', cur: i === 2 ? 'page' : 'false', badge: i === 0 ? 1 : 0, label: i === 0 ? '聊天,1 個 Agent 需要你' : name }));
    const col = (p) => (p >= 85 ? 'var(--u-high)' : p >= 70 ? 'var(--u-warn)' : 'var(--u-ok)');
    const usage = [
      { label: 'Claude · 5 小時', p: 38, note: '14:00 重設' }, { label: 'Claude · 7 天', p: 74, note: '週四重設' },
      { label: 'Codex · 5 小時', p: 12, note: '12 分鐘前' }, { label: 'Codex · 7 天', p: 90, note: '週六重設' }
    ].map((u) => ({ ...u, pct: u.p + '%', color: col(u.p), warn: u.p >= 70 }));
    const sshItems = [{ name: '通知', val: '需要你、完成' }, { name: '登入 Shell', val: '' }, { name: '分享…', val: '' }, { name: '這台主機的設定', val: '' }, { name: '編輯主機', val: '' }];
    const httpsItems = [{ name: '通知', val: '需要你' }, { name: '分享…', val: '' }, { name: '這台主機的設定', val: '' }, { name: '編輯主機', val: '' }];
    const ssh = { host: 'Ray Mac Mini', conn: 'Tailscale SSH · herdr 0.9.6', usage: true, hs: false, items: sshItems };
    const https = { host: 'Build Box', conn: 'HTTPS · buildbox.tail1234.ts.net', usage: false, hs: true, items: httpsItems };
    return {
      tabs, usage,
      screens: [
        { cls: 'dark', label: '深色 · SSH 主機', ...ssh },
        { cls: 'dark', label: '深色 · HTTPS 主機', ...https },
        { cls: 'light', label: '淺色 · SSH 主機', ...ssh },
        { cls: 'light', label: '淺色 · HTTPS 主機', ...https }
      ]
    };
  }
}
</script>
</body>
</html>
