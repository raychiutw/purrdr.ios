<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>模型選擇與投入程度</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1760px;height:980px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="col">
<div class="cap">{{t.name}} · 模型選擇(medium)</div>
<div class="phone {{t.cls}}">
<div class="msgs" style="opacity:.5"><div>我已經把上限改成 5 行。</div><div class="bubble">幫我開 PR</div></div>
<div class="scrimbg"></div>
<div class="sheet" style="top:330px">
<div class="grabber"></div>
<div class="sheettop"><button class="ib" style="background:var(--fill)" aria-label="關閉"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button><div class="st">模型選擇</div><span></span></div>
<div class="card">
<sc-for list="{{models}}" as="m" hint-placeholder-count="4">
<button class="cell" role="menuitemradio" aria-checked="{{m.on}}"><span class="cb"><span class="main"><span>{{m.name}}</span><span class="sub">{{m.desc}}</span></span><sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></span></button>
</sc-for>
</div>
<div class="card" style="margin-top:16px"><button class="cell"><span class="cb"><span class="main">投入程度</span><span class="pill">推薦</span><span class="val">中</span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button></div>
</div>
</div>
</div>
<div class="col">
<div class="cap">{{t.name}} · 投入程度(子頁)</div>
<div class="phone {{t.cls}}">
<div class="msgs" style="opacity:.5"><div>我已經把上限改成 5 行。</div></div>
<div class="scrimbg"></div>
<div class="sheet" style="top:250px">
<div class="grabber"></div>
<div class="sheettop"><button class="ib" style="background:var(--fill)" aria-label="返回模型選擇"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><div class="st">投入程度</div><span></span></div>
<div class="card">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="5">
<button class="cell" role="menuitemradio" aria-checked="{{l.on}}"><span class="cb"><span>{{l.name}}</span><sc-if value="{{l.rec}}" hint-placeholder-val="{{false}}"><span class="pill">推薦</span></sc-if><sc-if value="{{l.warn}}" hint-placeholder-val="{{false}}"><span class="warnpill"><svg width="13" height="13" viewBox="0 0 24 24" fill="var(--orange)" aria-hidden="true"><path d="M12 2.5l10.5 18.5H1.5L12 2.5zm-1 7v5h2v-5h-2zm0 7v2h2v-2h-2z"></path></svg>3.5× 或更多使用量</span></sc-if><span style="flex-grow:1"></span><sc-if value="{{l.on}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></span></button>
</sc-for>
</div>
<div class="card" style="margin-top:16px"><div class="cell"><span class="cb"><span class="main">Ultracode</span><span class="toggle" role="switch" aria-checked="false" aria-label="Ultracode"></span></span></div></div>
<div class="sf">較高的投入程度回應更詳盡,但更久、也更快用掉使用量。改了會成為新 session 的預設。</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }],
      models: [
        { name: 'Opus 5.5', desc: '適合複雜工作與日常任務', on: true },
        { name: 'Fable 5.2', desc: '應對最艱難的挑戰', on: false },
        { name: 'Sonnet 5.5', desc: '處理較簡單的任務,效率最高', on: false },
        { name: 'Haiku 5.5', desc: '最快速,適合快速解答', on: false }
      ],
      levels: [{ name: '低' }, { name: '中', rec: true, on: true }, { name: '高' }, { name: '超高' }, { name: '最高', warn: true }]
        .map((l) => ({ rec: false, warn: false, on: false, ...l }))
    };
  }
}
</script>
</body>
</html>
