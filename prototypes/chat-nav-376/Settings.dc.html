<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>設定 tab 與帳號頁</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="purrdr.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="board" style="width:1760px;height:980px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="col">
<div class="cap">{{t.name}} · 設定 tab</div>
<div class="phone grouped {{t.cls}}">
<div class="top"><div class="grp glass top-r"><button aria-label="帳號"><span class="avatar">R</span></button></div></div>
<div class="largetitle" style="top:104px">設定</div>
<div class="gl" style="top:150px">
<div class="sh">外觀</div>
<div class="card">
<sc-for list="{{appearance}}" as="a" hint-placeholder-count="3"><button class="cell" role="menuitemradio" aria-checked="{{a.on}}"><span class="cb"><span class="main">{{a.name}}</span><sc-if value="{{a.on}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></span></button></sc-for>
</div>
<div class="sf">「自動」跟著 iPhone 的深淺色設定。</div>
<div class="sh">用量顯示</div>
<div class="card">
<sc-for list="{{usage}}" as="a" hint-placeholder-count="2"><button class="cell" role="menuitemradio" aria-checked="{{a.on}}"><span class="cb"><span class="main">{{a.name}}</span><sc-if value="{{a.on}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></span></button></sc-for>
</div>
<div class="sh">鍵盤與觸覺</div>
<div class="card">
<div class="cell"><span class="cb"><span class="main">按 Return 送出</span><span class="toggle on" role="switch" aria-checked="true" aria-label="按 Return 送出"></span></span></div>
<div class="cell"><span class="cb"><span class="main">觸覺回饋</span><span class="toggle on" role="switch" aria-checked="true" aria-label="觸覺回饋"></span></span></div>
</div>
<div class="sh">送出可撤回</div>
<div class="card"><div class="cell"><span class="cb"><span class="main">3 秒</span><span style="display:flex;border-radius:10px;background:var(--fill);overflow:hidden" role="group" aria-label="送出可撤回秒數"><button aria-label="減少一秒" style="width:50px;height:44px;border:none;background:transparent;color:var(--text);font-size:20px">−</button><span style="width:1px;background:var(--sep)"></span><button aria-label="增加一秒" style="width:50px;height:44px;border:none;background:transparent;color:var(--text);font-size:20px">+</button></span></span></div></div>
<div class="sh">App 鎖</div>
<div class="card"><div class="cell"><span class="cb"><span class="main">需要 Face ID</span><span class="toggle" role="switch" aria-checked="false" aria-label="需要 Face ID"></span></span></div></div>
</div>
<nav class="tabbar glass" aria-label="分頁"><sc-for list="{{tabs}}" as="b" hint-placeholder-count="4"><a href="#" class="tab {{b.on}}" aria-current="{{b.cur}}" aria-label="{{b.label}}"><span class="tabicon"><svg width="26" height="24" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{b.icon}}"></path></svg><sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}"><span class="tbadge" aria-hidden="true">{{b.badge}}</span></sc-if></span><span>{{b.name}}</span></a></sc-for></nav>
</div>
</div>
<div class="col">
<div class="cap">{{t.name}} · 設定 tab(往下捲)</div>
<div class="phone grouped {{t.cls}}">
<div class="top"><div class="top-c"><span style="font-size:17px;font-weight:600">設定</span></div><div class="grp glass top-r"><button aria-label="帳號"><span class="avatar">R</span></button></div></div>
<div class="gl">
<div class="sh">支援</div>
<div class="card">
<button class="cell"><span class="cb"><span class="main">說明與支援</span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button>
<button class="cell"><span class="cb"><span class="main">再看一次歡迎頁</span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button>
<button class="cell"><span class="cb"><span class="main">為 Purrdr 評分</span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button>
</div>
<div class="sh">關於</div>
<div class="card">
<div class="cell"><span class="cb"><span class="main">版本</span><span class="val">0.49.0 (1234)</span></span></div>
<button class="cell"><span class="cb"><span class="main">隱私權政策</span><svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button>
</div>
</div>
<nav class="tabbar glass" aria-label="分頁"><sc-for list="{{tabs}}" as="b" hint-placeholder-count="4"><a href="#" class="tab {{b.on}}" aria-current="{{b.cur}}" aria-label="{{b.label}}"><span class="tabicon"><svg width="26" height="24" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{b.icon}}"></path></svg><sc-if value="{{b.badge}}" hint-placeholder-val="{{false}}"><span class="tbadge" aria-hidden="true">{{b.badge}}</span></sc-if></span><span>{{b.name}}</span></a></sc-for></nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const TABS = [['聊天', 'M3 4h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-4 3v-3H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M19 8h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-4a2 2 0 0 1-1.7-1H15a4 4 0 0 0 4-4z'], ['檔案', 'M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z'], ['主機', 'M2 4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6v3h3v2H7v-2h3v-3H4a2 2 0 0 1-2-2z'], ['流量', 'M8 2.5l5 5H9.6V15H6.4V7.5H3z M16 21.5l-5-5h3.4V9h3.2v7.5H21z'], ['設定', 'M12 2l2 2.5 3-.8.8 3 2.7 1.3-1 2.9 1 2.9-2.7 1.3-.8 3-3-.8L12 22l-2-2.5-3 .8-.8-3-2.7-1.3 1-2.9-1-2.9L6.2 7.7l.8-3 3 .8z M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z']];
    const tabs = TABS.map(([name, icon], i) => ({ name, icon, on: i === 4 ? 'on' : '', cur: i === 4 ? 'page' : 'false', badge: i === 0 ? 1 : 0, label: i === 0 ? '聊天,1 個 Agent 需要你' : name }));
    return {
      tabs,
      themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }],
      appearance: [{ name: '自動', on: true }, { name: '淺色', on: false }, { name: '深色', on: false }],
      usage: [{ name: '已用', on: true }, { name: '剩餘', on: false }]
    };
  }
}
</script>
</body>
</html>
