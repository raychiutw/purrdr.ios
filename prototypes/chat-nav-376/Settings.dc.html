<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>設定 tab 與帳號頁</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.dark{--bg:#1C1C1E;--sheet:#1C1C1E;--card:#2C2C2E;--fill:rgba(120,120,128,.32);--seg:#636366;--text:#FFFFFF;--sec:#AEAEB2;--sep:rgba(84,84,88,.65);--accent:#3CCF9E;--on:#000000;--glass:rgba(44,44,46,.86);--glassline:rgba(255,255,255,.14);--toggleon:#3CCF9E;--toggleoff:rgba(120,120,128,.4);--red:#FF453A}
.light{--bg:#F2F2F7;--sheet:#F2F2F7;--card:#FFFFFF;--fill:rgba(120,120,128,.16);--seg:#FFFFFF;--text:#000000;--sec:#636366;--sep:rgba(60,60,67,.29);--accent:#0B7A5C;--on:#FFFFFF;--glass:rgba(255,255,255,.88);--glassline:rgba(0,0,0,.08);--toggleon:#0B7A5C;--toggleoff:rgba(120,120,128,.2);--red:#D70015}
.glass{background:var(--glass);border:1px solid var(--glassline);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
</style>
</helmet>
<div style="width:1760px;height:980px;box-sizing:border-box;padding:40px;display:flex;gap:40px;background:#E4E4E9">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="font-size:16px;font-weight:600;color:#3A3A3C;height:20px">{{t.name}} · 設定 tab</div>
<div class="{{t.cls}}" style="width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);box-shadow:0 0 0 8px #0E0E10">
<div style="position:absolute;top:56px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;z-index:2">
<span style="width:84px"></span>
<span style="font-size:17px;font-weight:600">設定</span>
<div class="glass" style="height:44px;border-radius:22px;display:flex;align-items:center;gap:2px;padding:0 4px">
<button aria-label="新增聊天" style="width:36px;height:36px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button aria-label="帳號" style="width:32px;height:32px;border-radius:16px;border:none;background:var(--accent);color:var(--on);font-size:14px;font-weight:600;padding:0">R</button>
</div>
</div>
<div style="position:absolute;top:116px;left:16px;right:16px;bottom:0;display:flex;flex-direction:column;gap:6px;overflow:hidden">
<div style="font-size:13px;color:var(--sec);padding:6px 18px 2px">外觀</div>
<div style="background:var(--card);border-radius:22px;overflow:hidden">
<button style="width:100%;min-height:46px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;padding:0 18px;font-size:17px;text-align:left;border-bottom:solid 1px var(--sep)"><span style="flex-grow:1">自動</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="已選取"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
<button style="width:100%;min-height:46px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;padding:0 18px;font-size:17px;text-align:left;border-bottom:solid 1px var(--sep)"><span style="flex-grow:1">淺色</span></button>
<button style="width:100%;min-height:46px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;padding:0 18px;font-size:17px;text-align:left"><span style="flex-grow:1">深色</span></button>
</div>
<div style="font-size:13px;color:var(--sec);padding:0 18px">「自動」跟著 iPhone 的深淺色設定。</div>
<div style="font-size:13px;color:var(--sec);padding:12px 18px 2px">用量顯示</div>
<div style="background:var(--card);border-radius:22px;overflow:hidden">
<button style="width:100%;min-height:50px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;padding:0 18px;font-size:17px;text-align:left;border-bottom:solid 1px var(--sep)"><span style="flex-grow:1">已用</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="已選取"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
<button style="width:100%;min-height:50px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;padding:0 18px;font-size:17px;text-align:left"><span style="flex-grow:1">剩餘</span></button>
</div>
<div style="font-size:13px;color:var(--sec);padding:0 18px">套用到 5 小時、7 天與 context。</div>
<div style="font-size:13px;color:var(--sec);padding:12px 18px 2px">鍵盤與觸覺</div>
<div style="background:var(--card);border-radius:22px;overflow:hidden">
<div style="min-height:50px;display:flex;align-items:center;padding:0 18px;font-size:17px"><label style="flex-grow:1">按 Return 送出</label><div style="width:52px;height:32px;border-radius:16px;background:var(--toggleon);position:relative"><div style="position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:14px;background:#FFFFFF"></div></div></div>
</div>
<div style="font-size:13px;color:var(--sec);padding:12px 18px 2px">其他</div>
<div style="background:var(--card);border-radius:22px;overflow:hidden">
<sc-for list="{{others}}" as="o" hint-placeholder-count="4">
<button style="width:100%;min-height:50px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;padding:0 18px;font-size:17px;text-align:left;border-bottom:{{o.line}}"><span style="flex-grow:1">{{o.name}}</span><span style="color:var(--sec)">{{o.value}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</sc-for>
</div>
</div>
<nav class="glass" aria-label="分頁" style="position:absolute;left:20px;right:20px;bottom:30px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:1">
<sc-for list="{{tabs}}" as="b" hint-placeholder-count="4">
<a href="#" aria-current="{{b.cur}}" style="flex-grow:1;height:54px;border-radius:27px;background:{{b.bg}};color:{{b.fg}};text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500"><svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg><span>{{b.name}}</span></a>
</sc-for>
</nav>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:16px">
<div style="font-size:16px;font-weight:600;color:#3A3A3C;height:20px">{{t.name}} · 帳號頁(右上角)</div>
<div class="{{t.cls}}" style="width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#000;color:var(--text);box-shadow:0 0 0 8px #0E0E10">
<div style="position:absolute;inset:0;background:var(--bg);opacity:.55"></div>
<div style="position:absolute;left:0;right:0;top:48px;bottom:0;background:var(--sheet);border-radius:38px 38px 0 0;padding:8px 16px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:8px">
<div style="width:40px;height:5px;border-radius:3px;background:var(--fill);align-self:center"></div>
<div style="display:flex;align-items:center;position:relative;height:44px;margin-bottom:8px">
<button aria-label="關閉" class="glass" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--text);padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none">帳號</div>
</div>
<div style="background:var(--card);border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:14px">
<span style="width:48px;height:48px;border-radius:24px;background:var(--accent);color:var(--on);font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center">R</span>
<span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:600">Ray</span><span style="font-size:14px;color:var(--sec)">以 Apple 登入</span></span>
</div>
<div style="font-size:13px;color:var(--sec);padding:12px 18px 2px">會員</div>
<div style="background:var(--card);border-radius:22px"><button style="width:100%;min-height:58px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;padding:0 18px;font-size:17px;text-align:left"><span style="flex-grow:1;display:flex;flex-direction:column;gap:2px"><span>Purrdr Plus</span><span style="font-size:14px;color:var(--sec)">月繳 · 12 月 21 日續訂</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button></div>
<div style="font-size:13px;color:var(--sec);padding:12px 18px 2px">通知裝置</div>
<div style="background:var(--card);border-radius:22px;overflow:hidden">
<sc-for list="{{devices}}" as="d" hint-placeholder-count="2">
<div style="min-height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:{{d.line}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sec)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="{{d.x}}" y="3" width="{{d.w}}" height="18" rx="2.5"></rect></svg><span style="flex-grow:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px">{{d.name}}</span><span style="font-size:13px;color:var(--sec)">{{d.sub}}</span></span></div>
</sc-for>
</div>
<div style="background:var(--card);border-radius:22px;margin-top:16px"><button style="width:100%;min-height:50px;border:none;background:transparent;color:var(--red);font-size:17px">登出</button></div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const line = 'solid 1px var(--sep)';
    const tabs = [
      { name: '聊天', icon: 'M4 5h16v11H9l-5 4V5z' },
      { name: '檔案', icon: 'M3 6h6l2 2h10v11H3z' },
      { name: '主機', icon: 'M3 4h18v12H3z M8 20h8 M12 16v4' },
      { name: '設定', icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19 12l2-1-1-3-2 .3-1.5-1.5L17 5l-3-1-1 2h-2L10 4 7 5l.5 2.3L6 8.8 4 8.5l-1 3 2 1v2l-2 1 1 3 2-.3 1.5 1.5L7 21l3 1 1-2h2l1 2 3-1-.5-2.3 1.5-1.5 2 .3 1-3-2-1z' }
    ].map((t, i) => ({ ...t, cur: i === 3 ? 'page' : 'false', bg: i === 3 ? 'var(--fill)' : 'transparent', fg: i === 3 ? 'var(--accent)' : 'var(--text)' }));
    const others = [
      { name: '送出可撤回', value: '3 秒' }, { name: 'App 鎖', value: '關閉' }, { name: '支援', value: '' }, { name: '關於', value: '0.49.0' }
    ].map((o, i, a) => ({ ...o, line: i < a.length - 1 ? line : 'none' }));
    const devices = [
      { name: 'Ray 的 iPhone', sub: '這支裝置', x: 7, w: 10 },
      { name: 'Ray 的 iPad', sub: '昨天收到通知', x: 4, w: 16 }
    ].map((d, i, a) => ({ ...d, line: i < a.length - 1 ? line : 'none' }));
    return { themes: [{ cls: 'dark', name: '深色' }, { cls: 'light', name: '淺色' }], tabs, others, devices };
  }
}
</script>
</body>
</html>
