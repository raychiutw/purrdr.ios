<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>權限模式 sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"SF Pro Text","PingFang TC",system-ui,sans-serif;font-size:16px;border-radius:44px}
.under{position:absolute;inset:0;padding:120px 20px;color:#fff;opacity:.35;line-height:1.5}
.sheet{position:absolute;left:8px;right:8px;top:330px;bottom:8px;border-radius:36px;background:#1C1C1E;box-shadow:0 -10px 40px rgba(0,0,0,.6);padding:10px 16px 16px;overflow:hidden}
.grab{width:36px;height:5px;border-radius:3px;background:#48484A;margin:0 auto 10px}
.hd{display:flex;align-items:center;margin-bottom:10px}
.c44{width:44px;height:44px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(72,72,74,.7)}
.list{background:#2C2C2E;border-radius:22px;overflow:hidden}
.it{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:52px;border:0;background:none;color:#fff;font-family:inherit;font-size:17px;width:100%;text-align:left}
.hr{height:.5px;background:rgba(255,255,255,.12);margin-left:16px}
.foot{font-size:13px;color:#AEAEB2;margin:10px 8px 0;line-height:1.45}
</style>
</helmet>
<div class="ph">
  <div class="under" aria-hidden="true">PR #507 已合併，0.51.0 的 TestFlight 上傳正在跑。</div>
  <section class="sheet" aria-label="權限模式">
    <div class="grab" aria-hidden="true"></div>
    <div class="hd">
      <button class="c44" aria-label="關閉"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14"/></svg></button>
      <div style="flex:1;text-align:center;font-size:17px;font-weight:600;margin-right:44px">權限模式</div>
    </div>
    <div class="list">
      <button class="it">一般</button><div class="hr"></div>
      <button class="it">接受編輯</button><div class="hr"></div>
      <button class="it">Plan</button><div class="hr"></div>
      <button class="it"><svg width="16" height="18" viewBox="0 0 12 14" fill="none" stroke="#FF9F0A" stroke-width="1.3" aria-hidden="true"><path d="M6 1l4.5 2v3.5C10.5 9.5 8.5 12 6 13 3.5 12 1.5 9.5 1.5 6.5V3z"/><path d="M6 4.5v3M6 9.5v.3"/></svg>略過權限<svg style="margin-left:auto" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#3CCF9E" stroke-width="2.2" aria-hidden="true"><path d="M3.5 9.5l3.5 3.5 7.5-8"/></svg></button>
    </div>
    <div class="foot">選了就切換，成功後自動關閉。電腦上改了這裡會跟著變。</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
