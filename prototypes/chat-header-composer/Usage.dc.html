<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>用量 sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"SF Pro Text","PingFang TC",system-ui,sans-serif;font-size:16px;border-radius:44px}
.under{position:absolute;inset:0;padding:120px 20px;color:#fff;opacity:.35;line-height:1.5}
.sheet{position:absolute;left:8px;right:8px;top:150px;bottom:8px;border-radius:36px;background:#1C1C1E;box-shadow:0 -10px 40px rgba(0,0,0,.6);padding:10px 16px 16px;overflow:hidden}
.grab{width:36px;height:5px;border-radius:3px;background:#48484A;margin:0 auto 10px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.c44{width:44px;height:44px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(72,72,74,.7)}
.sec{font-size:15px;color:#AEAEB2;margin:16px 6px 6px}
.card{background:#2C2C2E;border-radius:22px;padding:14px 16px}
.row{display:flex;align-items:baseline;justify-content:space-between}
.k{font-size:18px;font-weight:600}
.v{font-size:15px;color:#AEAEB2}
.bar{height:8px;border-radius:4px;background:#3A3A3C;margin:10px 0 8px;overflow:hidden}
.n{font-size:14px;color:#AEAEB2}
</style>
</helmet>
<div class="ph">
  <div class="under" aria-hidden="true">PR #507 已合併，0.51.0 的 TestFlight 上傳正在跑。</div>
  <section class="sheet" aria-label="用量">
    <div class="grab" aria-hidden="true"></div>
    <div class="hd">
      <button class="c44" aria-label="關閉"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14"/></svg></button>
      <div style="font-size:17px;font-weight:600">用量</div>
      <button class="c44" aria-label="重新整理"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.8" aria-hidden="true"><path d="M16 10a6 6 0 11-2-4.5M16 3.5V7h-3.5"/></svg></button>
    </div>
    <div class="sec">這個聊天</div>
    <div class="card">
      <div class="row"><span class="k">Context</span><span class="v">已使用 21%</span></div>
      <div class="bar"><div style="width:21%;height:8px;background:#3CCF9E"></div></div>
      <div class="n">21 萬／100 萬 Token</div>
    </div>
    <div class="sec">方案用量 · Studio Mac</div>
    <div class="card">
      <div class="row"><span class="k">目前工作階段</span><span class="v">已使用 12%</span></div>
      <div class="bar"><div style="width:12%;height:8px;background:#3CCF9E"></div></div>
      <div class="n">11:10 重設</div>
    </div>
    <div class="card" style="margin-top:10px">
      <div class="row"><span class="k">每週：所有模型</span><span class="v">已使用 93%</span></div>
      <div class="bar"><div style="width:93%;height:8px;background:#FF453A"></div></div>
      <div class="n">週六 07:00 重設</div>
    </div>
    <div class="n" style="margin:14px 6px 0">更新時間：2 分鐘前</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
