<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>輸入框行為比較</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"SF Pro Text","PingFang TC",system-ui,sans-serif;font-size:16px;border-radius:44px}
.glass{background:rgba(44,44,46,.82);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px rgba(255,255,255,.12),0 6px 20px rgba(0,0,0,.4)}
.switch{position:absolute;left:12px;right:12px;top:52px;display:flex;gap:4px;padding:4px;border-radius:14px;background:#F2F2F7;z-index:9}
.sw{flex:1;border:0;border-radius:10px;background:none;font-family:inherit;font-size:13px;color:#1C1C1E;min-height:36px;padding:0}
.sw.on{background:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.samp{position:absolute;left:12px;right:12px;top:100px;display:flex;gap:6px;z-index:9}
.sb{border:1px solid #F2F2F7;border-radius:10px;background:#000;color:#F2F2F7;font-family:inherit;font-size:13px;min-height:34px;padding:0 12px}
.desc{position:absolute;left:20px;right:20px;top:150px;font-size:14px;color:#AEAEB2;line-height:1.5;white-space:pre-line}
.chat{position:absolute;left:20px;right:20px;top:270px;line-height:1.5;color:#fff;opacity:.8}
.dock{position:absolute;left:16px;right:16px;bottom:30px;display:flex;flex-direction:column;gap:8px}
.comp{border-radius:26px;padding:6px}
.row{display:flex;align-items:flex-end;gap:6px}
.rb{width:40px;height:40px;border-radius:20px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0;color:#fff;flex:none}
.send{background:#3CCF9E}
.send.off{background:#3A3A3C}
.ta{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font-family:inherit;font-size:17px;line-height:22px;resize:none;padding:9px 4px;box-sizing:border-box}
.ta::placeholder{color:#8E8E93}
.chip{height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.1);color:#fff;font-family:inherit;font-size:15px;padding:0 14px;display:flex;align-items:center;gap:6px}
.chipf{align-self:flex-start;height:34px;border-radius:17px;border:0;color:#fff;font-family:inherit;font-size:14px;padding:0 12px;display:flex;align-items:center;gap:6px}
</style>
</helmet>
<div class="ph">
  <div class="switch" role="group" aria-label="切換方案">
    <sc-for list="{{ modes }}" as="m" hint-placeholder-count="4"><button class="{{ m.cls }}" onClick="{{ m.pick }}">{{ m.label }}</button></sc-for>
  </div>
  <div class="samp">
    <button class="sb" onClick="{{ clear }}">清空</button>
    <button class="sb" onClick="{{ short }}">短句</button>
    <button class="sb" onClick="{{ long }}">長句</button>
  </div>
  <div class="desc">{{ desc }}</div>
  <div class="chat">目前沒有卡住的地方。TestFlight 上傳完成後我會通知你。</div>
  <div class="dock">
    <sc-if value="{{ chipAbove }}" hint-placeholder-val="{{ false }}">
      <button class="chipf glass">Sonnet 5.5 · 中 <span aria-hidden="true">⌄</span></button>
    </sc-if>
    <div class="comp glass">
      <sc-if value="{{ twoLayer }}" hint-placeholder-val="{{ false }}">
        <textarea class="ta" aria-label="訊息" placeholder="傳訊息給 purrdr.ios" rows="{{ rows }}" value="{{ text }}" onChange="{{ onText }}"></textarea>
        <div class="row" style="align-items:center">
          <button class="rb" aria-label="加入"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
          <button class="chip">Sonnet 5.5 · 中 <span aria-hidden="true">⌄</span></button>
          <span style="flex:1"></span>
          <button class="{{ sendCls }}" aria-label="送出"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#000" stroke-width="2.2" aria-hidden="true"><path d="M9 15V3M4 8l5-5 5 5"/></svg></button>
        </div>
      </sc-if>
      <sc-if value="{{ oneRow }}" hint-placeholder-val="{{ true }}">
        <div class="row">
          <button class="rb" aria-label="加入"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
          <textarea class="ta" aria-label="訊息" placeholder="傳訊息給 purrdr.ios" rows="{{ rows }}" value="{{ text }}" onChange="{{ onText }}"></textarea>
          <button class="{{ sendCls }}" aria-label="送出"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#000" stroke-width="2.2" aria-hidden="true"><path d="M9 15V3M4 8l5-5 5 5"/></svg></button>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { mode: 'K2', text: '' }; }
renderVals() {
  const s = this.state;
  const text = s.text || '';
  const perLine = (s.mode === 'K0' || s.mode === 'K2') ? 17 : 13;
  let lines = 0;
  text.split('\n').forEach((l) => { lines += Math.max(1, Math.ceil(l.length / perLine)); });
  if (!text) lines = 1;
  let twoLayer = false;
  if (s.mode === 'K0') twoLayer = text.length > 0;
  if (s.mode === 'K2') twoLayer = lines > 1 || (text.length > 13 && lines >= 1 && text.length > perLine - 4 && text.split('\n').length > 1);
  if (s.mode === 'K2') twoLayer = text.length > 13 || text.indexOf('\n') >= 0;
  const rows = Math.min(5, Math.max(1, twoLayer ? Math.ceil(text.length / 17) + (text.split('\n').length - 1) : lines));
  const descs = {
    K0: '現況：打第一個字就變成上下兩層，輸入框突然長高。',
    K1: 'K1 單列到底：[＋][輸入][送出]，字多才往上長高(最多 5 行)。\n模型移到「⋯」選單。',
    K2: 'K2 換行才展開：一行放得下就維持單列；\n超過一行才變成上下兩層，露出模型膠囊。(建議)',
    K3: 'K3 模型膠囊在輸入框上方：輸入列永遠單列，\n模型是一顆浮在左上的小膠囊。'
  };
  const labels = { K0: '現況', K1: 'K1', K2: 'K2', K3: 'K3' };
  return {
    text, rows, twoLayer, oneRow: !twoLayer,
    chipAbove: s.mode === 'K3',
    desc: descs[s.mode],
    sendCls: text ? 'rb send' : 'rb send off',
    modes: ['K0','K1','K2','K3'].map((k) => ({ label: labels[k], cls: k === s.mode ? 'sw on' : 'sw', pick: () => this.setState({ mode: k }) })),
    onText: (e) => this.setState({ text: e.target.value }),
    clear: () => this.setState({ text: '' }),
    short: () => this.setState({ text: '好' }),
    long: () => this.setState({ text: '先等 TestFlight 跑完，再幫我把 CHANGELOG 補上這版的兩個修正' })
  };
}
}
</script>
</body>
</html>
