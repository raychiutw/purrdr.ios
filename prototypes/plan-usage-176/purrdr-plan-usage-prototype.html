<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purrdr 方案用量原型</title>
<style>
/* PROTOTYPE，用完即丟。#176 方案用量畫面的三種版面＋各種狀態。顏色取自 DESIGN.md。 */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#E9E9EE; --fg:#000000; --muted:#636366; --sep:rgba(60,60,67,.18);
  --brand:#D80521; --brandFill:#EA0826; --ok:#248A3D; --warn:#C25E00; --bad:#D80521; --track:#E5E5EA;
  --page:#DCDCE2; --bar:#1C1C1E; --barFg:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fg:#FFFFFF; --muted:#AEAEB2; --sep:rgba(84,84,88,.55);
  --brand:#FC5D72; --ok:#30D158; --warn:#FF9F0A; --bad:#FC5D72; --track:#3A3A3C;
  --page:#111113; --bar:#F2F2F7; --barFg:#000000; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 120px}
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:32px;align-items:start}
.notes{min-width:0}
.notes h1{font-size:28px;margin:0 0 4px}
.notes .kicker{color:var(--muted);font-size:13px;margin:0 0 20px}
.notes h2{font-size:20px;margin:0 0 8px}
.notes h3{font-size:15px;margin:20px 0 8px;color:var(--muted)}
.notes p,.notes li{line-height:1.6;max-width:62ch}
.notes ul{padding-left:20px;margin:8px 0}
.statebox{background:var(--surface);border-radius:12px;padding:10px 14px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.phone{width:390px;max-width:100%;height:800px;border-radius:44px;background:var(--bg);overflow:hidden;
  box-shadow:0 0 0 10px #000,0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;position:sticky;top:24px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.phone{order:-1;margin:0 auto;height:720px;border-radius:32px;box-shadow:0 0 0 6px #000;position:relative;top:0}}
.statusbar{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:600}
.nav{flex:none;display:flex;align-items:center;gap:8px;padding:4px 16px 0}
.nav .back{color:var(--brand);font-size:17px;border:0;background:none;padding:8px 0}
.nav .sp{flex:1}
.nav .more{width:36px;height:36px;border-radius:18px;background:var(--surface2);border:0;color:var(--fg);font-size:18px}
.screen{flex:1;overflow-y:auto;padding:0 16px 40px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.big{font-size:34px;font-weight:700;margin:4px 0 12px}
.pull{text-align:center;color:var(--muted);font-size:12px;margin:-4px 0 8px}
.group{background:var(--surface);border-radius:12px;overflow:hidden;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 16px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.row .lbl{flex:1}
.row select{appearance:none;border:0;background:none;color:var(--muted);font:inherit;text-align:right;padding-right:16px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 7px) 55%,calc(100% - 2px) 55%;background-size:5px 5px;background-repeat:no-repeat;max-width:60%}
.foot{color:var(--muted);font-size:13px;margin:6px 16px 20px;line-height:1.45}
.hdr{color:var(--muted);font-size:13px;margin:16px 16px 6px;text-transform:none}
.meter{padding:12px 16px}
.meter + .meter{border-top:1px solid var(--sep)}
.meter .top1{display:flex;justify-content:space-between;align-items:baseline}
.meter .pct{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.meter .sub{color:var(--muted);font-size:13px;margin-top:6px}
.track{height:8px;border-radius:4px;background:var(--track);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px}
.lvl-ok{background:var(--ok)} .lvl-warn{background:var(--warn)} .lvl-bad{background:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:2px 8px}
.msg{padding:18px 16px;text-align:center}
.msg .ico{font-size:30px}
.msg h4{margin:8px 0 4px;font-size:17px}
.msg p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.btn{display:inline-block;margin-top:12px;border:0;border-radius:12px;background:var(--brandFill);color:#fff;font:600 16px var(--font);padding:12px 18px}
.btn.plain{background:var(--surface2);color:var(--fg)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--surface2);border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--fg);font:500 14px var(--font);padding:7px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hostrow{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:12px 16px;position:relative}
.hostrow + .hostrow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.hostrow .h1{display:flex;align-items:center;gap:8px}
.hostrow .h1 .n{flex:1;font-weight:600}
.hostrow .hint{color:var(--muted);font-size:13px}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.mini .track{margin:0;height:6px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:0;border-radius:16px;padding:7px 12px;background:var(--surface2);color:var(--fg);font:500 14px var(--font)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.ring{background:var(--surface);border-radius:16px;padding:16px;text-align:center}
.ring svg{width:120px;height:120px}
.ring .cap{font-weight:600;margin-top:6px}
.ring .sub{color:var(--muted);font-size:12px;margin-top:2px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--barFg);
  border-radius:18px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:9}
.bar button,.bar select{border:0;border-radius:12px;padding:8px 12px;font:600 14px var(--font);background:transparent;color:inherit}
.bar button[aria-pressed="true"]{background:var(--barFg);color:var(--bar)}
.bar select{background:rgba(127,127,127,.25)}
.bar select option{color:#000}
</style>
<body>
<div class="wrap">
  <div class="notes" id="notes"></div>
  <div class="phone" aria-label="iPhone 預覽">
    <div class="statusbar"><span>9:41</span><span>􀙇 100%</span></div>
    <div class="nav"><button class="back" type="button">‹ Agent</button><span class="sp"></span><button class="more" type="button" aria-label="顯示方式">⋯</button></div>
    <div class="screen" id="screen"></div>
  </div>
</div>
<div class="bar" id="bar"></div>
<script>
// PROTOTYPE：狀態都在記憶體。
const hosts = [
  {id:"mac", name:"Ray Mac Mini", icon:"🖥️", conn:"SSH", os:"macOS"},
  {id:"pc", name:"Ray PC", icon:"💻", conn:"SSH", os:"Windows"},
  {id:"office", name:"Office Linux", icon:"🐧", conn:"HTTPS", os:"Linux"},
  {id:"demo", name:"Demo 主機", icon:"✨", conn:"Demo", os:"Demo"},
];
const agents = [{id:"claude", name:"Claude Code"}, {id:"codex", name:"Codex"}];
const states = {
  data:"有資料", loading:"查詢中", consent:"需要同意(只有 Claude)", noData:"還沒有資料(只有 Claude)",
  notFound:"找不到 Codex", notLoggedIn:"Codex 未登入", offline:"連不上主機", stale:"資料較舊(超過 10 分鐘)",
};
const sample = {
  claude:{five:{used:38, resetIn:"2 小時 13 分"}, week:{used:61, resetIn:"3 天"}},
  codex:{five:{used:12, resetIn:"4 小時 2 分"}, week:{used:87, resetIn:"5 天"}},
};
const app = {variant:"U1", host:"mac", agent:"claude", state:"data", display:"remaining", queries:1, queried:{mac:true}};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hostOf = id => hosts.find(h => h.id === id);
function effectiveState(hostId, agentId){
  const host = hostOf(hostId);
  if (host.conn === "HTTPS") return "https";
  let st = app.state;
  if (agentId === "codex" && (st === "consent" || st === "noData")) st = "data";
  if (agentId === "claude" && (st === "notFound" || st === "notLoggedIn")) st = "data";
  return st;
}
function costText(hostId){
  return hostOf(hostId).conn === "Demo"
    ? `<span class="badge">↻ 不耗 token 與傳輸 · 畫面開著時自動重整</span>`
    : `<span class="badge">✋ 需要傳輸 · 下拉才重新查詢</span>`;
}
function level(remaining){ return remaining > 40 ? "lvl-ok" : remaining > 15 ? "lvl-warn" : "lvl-bad"; }
function figures(agentId){
  const s = sample[agentId];
  return [["5 小時", s.five], ["每週", s.week]].map(([label, w]) => {
    const remaining = 100 - w.used;
    const shown = app.display === "remaining" ? remaining : w.used;
    return {label, shown, remaining, word: app.display === "remaining" ? "剩餘" : "已用", resetIn: w.resetIn};
  });
}
function asOfText(st){ return st === "stale" ? "截至 13:05(Claude Code 最後一次回報)" : ""; }

function messageFor(st, agentId, host){
  const agentName = agents.find(a => a.id === agentId).name;
  const m = {
    loading:[`<span class="spin"></span>`, `正在查詢 ${esc(host.name)}…`, `只查這一次；離開畫面就取消。`],
    consent:["🔒", "要在這台主機顯示 Claude 方案用量嗎？", `會把 ${esc(host.name)} 上使用者 ray 的 Claude Code status line 換成 Purrdr 的包裝腳本，隨時可以關閉並還原。`, `<button class="btn" type="button" data-act="consent">檢查並顯示</button>`],
    noData:["⏳", "Claude Code 還沒回報方案用量", `在 ${esc(host.name)} 用一次 Claude Code 後，再下拉重新整理。`],
    notFound:["❓", "這台主機找不到 Codex", `${esc(host.name)} 上沒有 codex 指令。`],
    notLoggedIn:["🔑", "Codex 尚未登入", `先在 ${esc(host.name)} 執行 codex login。`],
    offline:["⚠️", `連不上 ${esc(host.name)}`, "下拉重試。"],
    https:["🚫", "這種連線方式不支援方案用量", `${esc(host.name)} 用 HTTPS 連線；改選 SSH 主機查詢。`],
  }[st];
  if (!m) return "";
  return `<div class="msg"><div class="ico">${m[0]}</div><h4>${m[1]}</h4><p>${m[2]}</p>${m[3]||""}</div>`;
}

// U1：表單式，兩個選單＋結果
function renderU1(){
  const host = hostOf(app.host), st = effectiveState(app.host, app.agent);
  const pickers = `<div class="group">
    <label class="row"><span class="lbl">主機</span><select data-pick="host" aria-label="主機">${hosts.map(h=>`<option value="${h.id}" ${h.id===app.host?"selected":""}>${h.icon} ${esc(h.name)}</option>`).join("")}</select></label>
    <label class="row"><span class="lbl">Agent</span><select data-pick="agent" aria-label="Agent">${agents.map(a=>`<option value="${a.id}" ${a.id===app.agent?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>
  </div>`;
  const body = (st === "data" || st === "stale")
    ? `<div class="hdr">${esc(host.name)} · ${esc(agents.find(a=>a.id===app.agent).name)}</div><div class="group">${figures(app.agent).map(f=>`
      <div class="meter" role="group" aria-label="${f.label}，${f.word} ${f.shown}%，${f.resetIn}後重置">
        <div class="top1"><span>${f.label}</span><span class="pct">${f.word} ${f.shown}%</span></div>
        <div class="track" aria-hidden="true"><i class="${level(f.remaining)}" style="width:${f.shown}%"></i></div>
        <div class="sub">${f.resetIn}後重置</div></div>`).join("")}</div>
      <div class="foot">${asOfText(st) || "剛剛查詢"}${app.agent==="claude" && host.conn!=="Demo" ? " · <a href=\"#\" data-act=\"off\" style=\"color:var(--brand)\">關閉這台主機的 Claude 用量</a>" : ""}</div>`
    : `<div class="group">${messageFor(st, app.agent, host)}</div>`;
  return `<div class="big">方案用量</div><div class="pull">↓ 下拉重新整理</div>${pickers}<div style="margin:0 4px 4px">${costText(app.host)}</div>${body}`;
}

// U2：Agent 分段＋所有主機一列，點哪台才查哪台
function renderU2(){
  const seg = `<div class="seg" role="group" aria-label="Agent">${agents.map(a=>`<button type="button" data-pick-agent="${a.id}" aria-pressed="${a.id===app.agent}">${esc(a.name)}</button>`).join("")}</div>`;
  const rows = hosts.map(h => {
    const st = effectiveState(h.id, app.agent);
    let detail;
    if (st === "https") detail = `<div class="hint">HTTPS 連線不支援方案用量</div>`;
    else if (!app.queried[h.id]) detail = `<div class="hint">點一下查詢</div>`;
    else if (st === "data" || st === "stale") detail = `<div class="mini">${figures(app.agent).map(f=>`<span>${f.label}</span><div class="track"><i class="${level(f.remaining)}" style="width:${f.shown}%"></i></div><span>${f.word} ${f.shown}% · ${f.resetIn}</span>`).join("")}</div>${st==="stale"?`<div class="hint" style="margin-top:4px">${asOfText(st)}</div>`:""}`;
    else if (st === "loading") detail = `<div class="hint"><span class="spin"></span> 查詢中…</div>`;
    else detail = `<div class="hint">${({consent:"需要同意才能讀 Claude 用量 ›", noData:"Claude Code 還沒回報", notFound:"找不到 Codex", notLoggedIn:"Codex 未登入", offline:"連不上，點一下重試"})[st]||""}</div>`;
    return `<button class="hostrow" type="button" data-query="${h.id}"><div class="h1"><span aria-hidden="true">${h.icon}</span><span class="n">${esc(h.name)}</span><span class="badge">${h.conn==="Demo"?"自動":h.conn==="HTTPS"?"—":"手動"}</span></div>${detail}</button>`;
  }).join("");
  return `<div class="big">方案用量</div>${seg}<div class="group">${rows}</div>
    <div class="foot">只查你點的主機，離開畫面就不再連線。同一個服務方案在不同主機讀到的是同一份，差別只在多新。</div>`;
}

// U3：主機與 Agent 用膠囊，結果是兩個大圓環
function ring(f){
  const r = 48, c = 2*Math.PI*r, dash = c * f.shown / 100;
  return `<div class="ring" role="group" aria-label="${f.label}，${f.word} ${f.shown}%，${f.resetIn}後重置">
    <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--track)" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--${level(f.remaining).slice(4)})" stroke-width="12" stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 60 60)"/>
    <text x="60" y="66" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">${f.shown}%</text></svg>
    <div class="cap">${f.label} · ${f.word}</div><div class="sub">${f.resetIn}後重置</div></div>`;
}
function renderU3(){
  const host = hostOf(app.host), st = effectiveState(app.host, app.agent);
  const hostChips = `<div class="chips" role="group" aria-label="主機">${hosts.map(h=>`<button class="chip" type="button" data-pick-host="${h.id}" aria-pressed="${h.id===app.host}">${h.icon} ${esc(h.name)}</button>`).join("")}</div>`;
  const agentChips = `<div class="chips" role="group" aria-label="Agent">${agents.map(a=>`<button class="chip" type="button" data-pick-agent="${a.id}" aria-pressed="${a.id===app.agent}">${esc(a.name)}</button>`).join("")}</div>`;
  const body = (st === "data" || st === "stale")
    ? `<div class="rings">${figures(app.agent).map(ring).join("")}</div><div class="foot">${asOfText(st) || "剛剛查詢"}</div>`
    : `<div class="group">${messageFor(st, app.agent, host)}</div>`;
  return `<div class="big">方案用量</div><div class="pull">↓ 下拉重新整理</div>${hostChips}${agentChips}<div style="margin:0 4px 8px">${costText(app.host)}</div>${body}`;
}

const variants = {
  U1:{name:"表單", render:renderU1, note:`<h2>U1 · 表單式</h2><p>上面兩列是「主機」「Agent」選單，下面是兩個用量週期的比例條。最像 iOS 設定頁，資訊量最少、最直接。</p>
    <ul><li>一次只看一台主機的一種 Agent，查詢次數最少。</li><li>Claude 的同意與關閉放在結果下方。</li><li>代價：要比較兩台主機得切換選單。</li></ul>`},
  U2:{name:"主機清單", render:renderU2, note:`<h2>U2 · Agent 分段＋主機清單</h2><p>上方切換 Claude Code／Codex，下面列出所有主機。進畫面只查上次那台，其他主機顯示「點一下查詢」，點到才查。</p>
    <ul><li>一眼看出哪台主機的資料比較新、哪台不支援。</li><li>適合多台主機登入不同方案的情況。</li><li>代價：每列比較擠，查過的主機越多畫面越長。</li></ul>`},
  U3:{name:"圓環", render:renderU3, note:`<h2>U3 · 膠囊＋大圓環</h2><p>主機與 Agent 都是橫向膠囊，結果是兩個大圓環。像健康 App 的摘要，最搶眼。</p>
    <ul><li>數字最大，掃一眼就知道剩多少。</li><li>代價：主機多時膠囊要橫向捲動；圓環佔空間。</li></ul>`},
};

function render(){
  const v = variants[app.variant];
  document.getElementById("screen").innerHTML = v.render();
  document.getElementById("notes").innerHTML = `<h1>方案用量 原型</h1><p class="kicker">PROTOTYPE · #176 · 用下方工具列切版面與狀態</p>${v.note}
    <h3>查詢規則</h3><ul><li>SSH 主機：需要傳輸，只在進畫面、改選、下拉時查一次。</li><li>Demo 主機：不耗 token 與傳輸，畫面開著時自動重整。</li><li>HTTPS 主機：不支援，不連線。</li></ul>
    <h3>目前狀態</h3><div class="statebox">${esc(JSON.stringify({variant:app.variant, host:app.host, agent:app.agent, state:effectiveState(app.host, app.agent), display:app.display, 查詢次數:app.queries}, null, 1))}</div>`;
  document.getElementById("bar").innerHTML = Object.entries(variants).map(([k, v]) => `<button type="button" data-variant="${k}" aria-pressed="${k===app.variant}">${k} ${v.name}</button>`).join("")
    + `<select data-state aria-label="狀態">${Object.entries(states).map(([k, t]) => `<option value="${k}" ${k===app.state?"selected":""}>${t}</option>`).join("")}</select>`
    + `<button type="button" data-display>${app.display==="remaining"?"顯示剩餘":"顯示已用"}</button>`;
  try { history.replaceState(null, "", "#" + app.variant); } catch (e) {}
}
function query(){ app.queries++; }
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,a");
  if (!t) return;
  if (t.dataset.variant) app.variant = t.dataset.variant;
  else if (t.hasAttribute("data-display")) app.display = app.display === "remaining" ? "used" : "remaining";
  else if (t.dataset.pickAgent) { app.agent = t.dataset.pickAgent; app.queried = {[app.host]: true}; query(); }
  else if (t.dataset.pickHost) { app.host = t.dataset.pickHost; query(); }
  else if (t.dataset.query) { app.host = t.dataset.query; app.queried[t.dataset.query] = true; query(); }
  else if (t.dataset.act === "consent") app.state = "data";
  else if (t.dataset.act === "off") { ev.preventDefault(); app.state = "consent"; }
  else return;
  render();
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.pick === "host") { app.host = t.value; query(); }
  else if (t.dataset.pick === "agent") { app.agent = t.value; query(); }

if (variants[fromHash]) app.variant = fromHash;
